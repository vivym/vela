openapi: 3.0.3
info:
  title: Vela API
  version: 1.0.0
  description: Project-scoped asynchronous AI generation API.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /v1/organizations/{organization_id}/members:
    post:
      operationId: createHumanMember
      summary: Add a Human member to a Customer Organization
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHumanMemberRequest'
      responses:
        '201':
          description: Human member added or replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HumanMember'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: OIDC subject conflicts with an existing Human identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: listHumanMembers
      summary: List Human members in a Customer Organization
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/ListLimit'
      responses:
        '200':
          description: Safe Human member and Organization role projections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HumanMemberList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/organizations/{organization_id}/members/{principal_id}/roles:
    post:
      operationId: assignOrganizationRole
      summary: Assign a fixed Organization role to a Human member
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/PrincipalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignOrganizationRoleRequest'
      responses:
        '200':
          description: Organization role assignment committed or replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationRoleAssignment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Human member is not visible in this Customer Organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/organizations/{organization_id}/members/{principal_id}/disable:
    post:
      operationId: disableHumanMember
      summary: Permanently disable a Human member
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/PrincipalId'
      responses:
        '200':
          description: Human member disablement committed or replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HumanMember'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Human member is not visible in this Customer Organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Disablement would remove the final active OrganizationOwner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/organizations/{organization_id}/members/{principal_id}/roles/{role}/revoke:
    post:
      operationId: revokeOrganizationRole
      summary: Revoke a fixed Organization role from a Human member
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/PrincipalId'
        - $ref: '#/components/parameters/OrganizationRoleName'
      responses:
        '200':
          description: Organization role revocation committed or replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationRoleAssignment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Human member is not visible in this Customer Organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Revocation would remove the final active OrganizationOwner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/organizations/{organization_id}/billing/credit:
    get:
      operationId: getOrganizationCreditSummary
      summary: Read the Customer Organization credit summary
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Exact PostgreSQL-authoritative credit summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationCreditSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Customer Organization is not visible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/organizations/{organization_id}/billing/charges:
    get:
      operationId: listOrganizationCharges
      summary: List immutable Charges and available Invoice references
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/ListLimit'
      responses:
        '200':
          description: Safe Organization Charge projections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationChargeList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/organizations/{organization_id}/billing/settlement-contacts:
    post:
      operationId: createSettlementContact
      summary: Create or replay an Organization settlement contact
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSettlementContactRequest'
      responses:
        '201':
          description: Settlement contact created or replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementContact'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      operationId: listSettlementContacts
      summary: List Organization settlement contacts
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/ListLimit'
      responses:
        '200':
          description: Settlement contacts including permanent disablement state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementContactList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/organizations/{organization_id}/billing/settlement-contacts/{contact_id}/disable:
    post:
      operationId: disableSettlementContact
      summary: Permanently disable an Organization settlement contact
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/ContactId'
      responses:
        '200':
          description: Settlement-contact disablement committed or replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementContact'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Settlement contact is not visible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/organizations/{organization_id}/usage:
    get:
      operationId: getOrganizationUsage
      summary: Read bounded non-content Organization usage
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/UsageFrom'
        - $ref: '#/components/parameters/UsageTo'
      responses:
        '200':
          description: Organization and per-Project usage aggregates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationUsage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/organizations/{organization_id}/audit-events:
    get:
      operationId: listOrganizationAuditEvents
      summary: List safe immutable Organization administration evidence
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/ListLimit'
      responses:
        '200':
          description: Unified safe audit-event projections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationAuditEventList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/projects/{project_id}/members:
    get:
      operationId: listProjectMembers
      summary: List Human members assigned to a Project
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ListLimit'
      responses:
        '200':
          description: Safe Project member and fixed-role projections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMemberList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Project is not visible in this Customer Organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/projects/{project_id}/members/{principal_id}/roles:
    post:
      operationId: assignProjectRole
      summary: Assign a fixed Project role to a Human member
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/PrincipalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignProjectRoleRequest'
      responses:
        '200':
          description: Project role assignment committed or replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectRoleAssignment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Human member or Project is not visible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/projects/{project_id}/members/{principal_id}/roles/{role}/revoke:
    post:
      operationId: revokeProjectRole
      summary: Revoke a fixed Project role from a Human member
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/PrincipalId'
        - $ref: '#/components/parameters/ProjectRoleName'
      responses:
        '200':
          description: Project role revocation committed or replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectRoleAssignment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Human member or Project is not visible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/projects/{project_id}/jobs:
    post:
      operationId: submitJob
      summary: Submit a Job for durable Admission
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitJobRequest'
      responses:
        '202':
          description: Job accepted durably
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '402':
          description: Contract Credit Limit is insufficient
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Idempotency key was accepted with different content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Project queue limit is exhausted
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Compatible capacity is unavailable
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/projects/{project_id}/jobs/{job_id}:
    get:
      operationId: getJob
      summary: Get authoritative Project Job state
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Current Job state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Job is not visible in this Project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/projects/{project_id}/jobs/{job_id}/cancel:
    post:
      operationId: cancelJob
      summary: Commit a Customer Cancellation decision
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Cancellation committed or replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Job is not visible in this Project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/projects/{project_id}/jobs/{job_id}/artifacts:
    get:
      operationId: getJobArtifacts
      summary: Get the committed ArtifactSet with short-lived exact-version URLs
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Committed ArtifactSet and exact-version downloads
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactSet'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: ArtifactSet is not visible or not currently accessible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/projects/{project_id}/service-principals:
    post:
      operationId: createServicePrincipal
      summary: Create a Project Service Principal
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServicePrincipalRequest'
      responses:
        '201':
          description: Service Principal created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePrincipal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Service Principal conflicts with existing identity state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: listServicePrincipals
      summary: List safe Project Service Principal projections
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ListLimit'
      responses:
        '200':
          description: Project Service Principals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePrincipalList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/projects/{project_id}/service-principals/{service_principal_id}/disable:
    post:
      operationId: disableServicePrincipal
      summary: Permanently disable a Project Service Principal
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ServicePrincipalId'
      responses:
        '200':
          description: Service Principal disabled or replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePrincipal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Service Principal is not visible in this Project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/projects/{project_id}/service-principals/{service_principal_id}/credentials:
    post:
      operationId: issueServiceCredential
      summary: Issue an overlapping Service Principal Credential
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ServicePrincipalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueServiceCredentialRequest'
      responses:
        '201':
          description: Credential issued; bearer material is returned once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedServiceCredential'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Service Principal is not active or visible in this Project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Credential conflicts with existing identity state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: listServiceCredentials
      summary: List safe Service Principal Credential projections
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ServicePrincipalId'
        - $ref: '#/components/parameters/ListLimit'
      responses:
        '200':
          description: Service Principal Credentials without bearer material or digests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceCredentialList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Service Principal is not visible in this Project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/projects/{project_id}/service-principals/{service_principal_id}/credentials/{credential_id}/revoke:
    post:
      operationId: revokeServiceCredential
      summary: Permanently revoke a Service Principal Credential
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ServicePrincipalId'
        - $ref: '#/components/parameters/CredentialId'
      responses:
        '200':
          description: Credential revoked or replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceCredential'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Credential is not visible for this Service Principal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/projects/{project_id}/webhook-subscriptions:
    post:
      operationId: createWebhookSubscription
      summary: Create a Project Webhook Subscription
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebhookSubscriptionRequest'
      responses:
        '201':
          description: Subscription created; the signing secret is returned once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedWebhookSubscription'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      operationId: listWebhookSubscriptions
      summary: List safe Project Webhook Subscription projections
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/ListLimit'
      responses:
        '200':
          description: Project Webhook Subscriptions without signing secrets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscriptionList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/projects/{project_id}/webhook-subscriptions/{subscription_id}/rotate-secret:
    post:
      operationId: rotateWebhookSubscriptionSecret
      summary: Rotate a Webhook Subscription signing secret
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/SubscriptionId'
      responses:
        '200':
          description: Secret rotated with a bounded previous-secret overlap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotatedWebhookSubscription'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Webhook Subscription is not visible in this Project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: A secret overlap or another conflicting transition is active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/projects/{project_id}/webhook-subscriptions/{subscription_id}/disable:
    post:
      operationId: disableWebhookSubscription
      summary: Permanently disable a Webhook Subscription
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/SubscriptionId'
      responses:
        '200':
          description: Subscription disabled or replayed idempotently
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscription'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Webhook Subscription is not visible in this Project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/projects/{project_id}/webhook-subscriptions/{subscription_id}/deliveries:
    get:
      operationId: listWebhookDeliveries
      summary: List safe Webhook Delivery projections
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/SubscriptionId'
        - $ref: '#/components/parameters/ListLimit'
      responses:
        '200':
          description: Webhook Deliveries without payloads, secrets, or claim tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDeliveryList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Webhook Subscription is not visible in this Project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/projects/{project_id}/webhook-subscriptions/{subscription_id}/deliveries/{delivery_id}/replay:
    post:
      operationId: replayWebhookDelivery
      summary: Manually replay a terminal Webhook Delivery
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/SubscriptionId'
        - $ref: '#/components/parameters/DeliveryId'
      responses:
        '200':
          description: Delivery returned to PENDING with a fresh retry window
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDelivery'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Webhook Delivery is not visible in this Project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Delivery is nonterminal, disabled, or already replaying
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
