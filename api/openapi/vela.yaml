        type: string
        format: uuid
    ContactId:
      name: contact_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UsageFrom:
      name: from
      in: query
      required: true
      schema:
        type: string
        format: date-time
    UsageTo:
      name: to
      in: query
      required: true
      schema:
        type: string
        format: date-time
    ListLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 100
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
