[project]
name = "vela-h3-runner"
version = "0.1.0"
description = "Vela H3 inference backend runner"
requires-python = ">=3.13,<3.14"
dependencies = [
  "grpcio==1.83.0",
  "protobuf==7.36.0",
]

[project.scripts]
vela-h3-runner = "vela_h3_runner.main:main"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "grpcio-tools==1.83.0",
  "pytest==9.1.1",
  "ruff==0.16.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vela_h3_runner", "src/vela"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["src/vela/v1/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/vela_h3_runner/runtime.py" = ["SIM115"]
