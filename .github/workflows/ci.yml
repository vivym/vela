name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  VELA_REQUIRE_PINNED_FFPROBE: "1"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.22"
          enable-cache: true
          cache-dependency-glob: runner/uv.lock

      - name: Install locked H3 runner environment
        working-directory: runner
        run: uv sync --frozen

      - name: Build pinned ffprobe
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends binutils musl-tools
          archive="${RUNNER_TEMP}/ffmpeg-8.0.1.tar.xz"
          curl --fail --location --silent --show-error --retry 4 --retry-all-errors \
            https://ffmpeg.org/releases/ffmpeg-8.0.1.tar.xz \
            --output "${archive}"
          echo "05ee0b03119b45c0bdb4df654b96802e909e0a752f72e4fe3794f487229e5a41  ${archive}" \
            | sha256sum --check --strict
          tar --extract --file "${archive}" --directory "${RUNNER_TEMP}"
          cd "${RUNNER_TEMP}/ffmpeg-8.0.1"
          ./configure \
            --cc=musl-gcc \
            --disable-everything \
            --disable-autodetect \
            --disable-doc \
            --disable-network \
            --disable-x86asm \
            --disable-shared \
            --enable-static \
            --extra-ldflags=-static \
            --enable-decoder=h264 \
            --enable-decoder=webp \
            --enable-demuxer=image_webp_pipe \
            --enable-demuxer=mov \
            --enable-ffprobe \
            --enable-parser=h264 \
            --enable-parser=webp \
            --enable-protocol=fd \
            --enable-protocol=file
          make --jobs="$(nproc)" ffprobe
          install --directory "${RUNNER_TEMP}/ffprobe-bin"
          install --mode=0755 ffprobe "${RUNNER_TEMP}/ffprobe-bin/ffprobe"
          echo "${RUNNER_TEMP}/ffprobe-bin" >> "${GITHUB_PATH}"
          cd "${GITHUB_WORKSPACE}"
          CGO_ENABLED=0 go build -trimpath \
            -o "${RUNNER_TEMP}/ffprobe-bin/vela-artifact-validator" \
            ./cmd/vela-artifact-validator
          echo "VELA_ARTIFACT_VALIDATOR_HELPER_PATH=${RUNNER_TEMP}/ffprobe-bin/vela-artifact-validator" \
            >> "${GITHUB_ENV}"

      - name: Verify generated, source, and deployment contracts
        run: make verify

      - name: PostgreSQL and JetStream integration test
        run: make test-integration

      - name: Check contract compatibility
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          contract_base="${RUNNER_TEMP}/vela-contract-base"
          mkdir -p "${contract_base}"
          if git cat-file -e "${BASE_SHA}:buf.yaml"; then
            git archive "${BASE_SHA}" buf.yaml proto | tar -x -C "${contract_base}"
            go run github.com/bufbuild/buf/cmd/buf@v1.72.0 breaking . --against "${contract_base}"
          fi
          if git cat-file -e "${BASE_SHA}:api/openapi/vela.yaml"; then
            git show "${BASE_SHA}:api/openapi/vela.yaml" > "${contract_base}/vela.yaml"
            go run github.com/oasdiff/oasdiff@v1.29.1 breaking \
              "${contract_base}/vela.yaml" api/openapi/vela.yaml
          fi
