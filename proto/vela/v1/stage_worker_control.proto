syntax = "proto3";

package vela.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "vela/v1/model_runtime.proto";
import "vela/v1/stage_authority.proto";

option go_package = "github.com/vivym/vela/proto/gen/vela/v1;velav1";

service StageWorkerControlService {
  rpc Connect(stream StageWorkerControlServiceConnectRequest)
      returns (stream StageWorkerControlServiceConnectResponse);
}

enum StageWorkerCommandDecision {
  STAGE_WORKER_COMMAND_DECISION_UNSPECIFIED = 0;
  STAGE_WORKER_COMMAND_DECISION_ACCEPTED = 1;
  STAGE_WORKER_COMMAND_DECISION_REPLAYED = 2;
  STAGE_WORKER_COMMAND_DECISION_STALE = 3;
  STAGE_WORKER_COMMAND_DECISION_REJECTED = 4;
}

enum StageWorkerStopReason {
  STAGE_WORKER_STOP_REASON_UNSPECIFIED = 0;
  STAGE_WORKER_STOP_REASON_AUTHORITY_REVOKED = 1;
  STAGE_WORKER_STOP_REASON_LEASE_EXPIRED = 2;
  STAGE_WORKER_STOP_REASON_PARENT_CANCELED = 3;
  STAGE_WORKER_STOP_REASON_MEMBER_BARRIER_FAILED = 4;
}

enum StageWorkerOperation {
  STAGE_WORKER_OPERATION_UNSPECIFIED = 0;
  STAGE_WORKER_OPERATION_REGISTER_WORKER_EVIDENCE = 1;
  STAGE_WORKER_OPERATION_REPORT_CAPACITY_OBSERVATION = 2;
  STAGE_WORKER_OPERATION_ACQUIRE_STAGE = 3;
  STAGE_WORKER_OPERATION_START_STAGE = 4;
  STAGE_WORKER_OPERATION_HEARTBEAT_STAGE = 5;
  STAGE_WORKER_OPERATION_SEAL_STAGE_OUTPUT = 6;
  STAGE_WORKER_OPERATION_COMMIT_STAGE_MATERIALIZATION = 7;
  STAGE_WORKER_OPERATION_FAIL_STAGE = 8;
  STAGE_WORKER_OPERATION_REATTACH_STAGE = 9;
  STAGE_WORKER_OPERATION_REPORT_MATERIALIZATION_SOURCE_LOST = 10;
  STAGE_WORKER_OPERATION_RESOLVE_INPUT_TRANSFER = 11;
  STAGE_WORKER_OPERATION_CONSUME_INPUT_TRANSFER = 12;
}

message StageWorkerControlServiceConnectRequest {
  string request_id = 1;
  int64 control_session_epoch = 2;
  oneof operation {
    RegisterWorkerEvidenceRequest register_worker_evidence = 10;
    ReportStageCapacityObservationRequest report_capacity_observation = 11;
    AcquireStageRequest acquire_stage = 12;
    StartStageRequest start_stage = 13;
    HeartbeatStageRequest heartbeat_stage = 14;
    SealStageOutputRequest seal_stage_output = 15;
    CommitStageMaterializationRequest commit_stage_materialization = 16;
    FailStageRequest fail_stage = 17;
    ReattachStageRequest reattach_stage = 18;
    ReportMaterializationSourceLostRequest report_materialization_source_lost = 19;
    ResolveInputTransferRequest resolve_input_transfer = 20;
    ConsumeInputTransferRequest consume_input_transfer = 21;
  }
}

message StageWorkerControlServiceConnectResponse {
  string request_id = 1;
  oneof result {
    WorkerReadinessDecision worker_readiness_decision = 10;
    StageAssignment stage_assignment = 11;
    NoStageWork no_work = 12;
    StageCommandResult stage_command_result = 13;
    StopStage stop_stage = 14;
    MaterializationAuthority materialization_authority = 15;
    ResolvedInputTransfer resolved_input_transfer = 16;
  }
}

message RegisterWorkerEvidenceRequest {
  ModelRuntimeIdentity runtime_identity = 1;
  int64 capacity_observation_sequence = 2;
  repeated StageAuthorityDeviceEpoch devices = 3;
  repeated StageAuthorityMemberEpoch members = 4;
  bytes readiness_evidence = 5;
}

message ReportStageCapacityObservationRequest {
  string worker_instance_id = 1;
  int64 worker_instance_epoch = 2;
  int64 observation_sequence = 3;
  map<string, int64> capacity_vector = 4;
  google.protobuf.Timestamp observed_at = 5;
  google.protobuf.Timestamp expires_at = 6;
}

message AcquireStageRequest {
  string worker_instance_id = 1;
  int64 worker_instance_epoch = 2;
  int64 capacity_observation_sequence = 3;
  string model_residency_id = 4;
  int64 model_runtime_epoch = 5;
  string stage_profile_revision_id = 6;
}

message StartStageRequest {
  StageAuthority authority = 1;
  google.protobuf.Timestamp started_at = 2;
}

message HeartbeatStageRequest {
  StageAuthority authority = 1;
  int64 sequence = 2;
  ModelRuntimeExecutionState runtime_state = 3;
  bytes bounded_status_json = 4;
  string local_receipt_id = 5;
  bytes local_receipt_digest = 6;
  google.protobuf.Timestamp observed_at = 7;
}

message SealStageOutputRequest {
  StageAuthority authority = 1;
  LocalMaterializationReceipt local_receipt = 2;
}

message CommitStageMaterializationRequest {
  MaterializationAuthority materialization_authority = 1;
  string object_version = 2;
  google.protobuf.Timestamp committed_at = 3;
}

message ReportMaterializationSourceLostRequest {
  MaterializationAuthority materialization_authority = 1;
  bytes failure_fingerprint = 2;
  int64 consumed_resource_units = 3;
  google.protobuf.Timestamp lost_at = 4;
  google.protobuf.Timestamp retry_at = 5;
}

message FailStageRequest {
  StageAuthority authority = 1;
  string failure_class = 2;
  bytes failure_fingerprint = 3;
  string detail = 4;
  bool worker_reusable = 5;
  int64 consumed_resource_units = 6;
  google.protobuf.Timestamp failed_at = 7;
  google.protobuf.Timestamp retry_at = 8;
}

message ReattachStageRequest {
  StageAuthority authority = 1;
  string local_receipt_id = 2;
  bytes local_receipt_digest = 3;
  ModelRuntimeExecutionState observed_runtime_state = 4;
}

message ResolveInputTransferRequest {
  StageAuthority authority = 1;
  string ticket_id = 2;
  bytes token_digest = 3;
  string worker_instance_id = 4;
  int64 worker_instance_epoch = 5;
  string model_residency_id = 6;
  int64 model_runtime_epoch = 7;
  string connector_revision_id = 8;
  google.protobuf.Timestamp resolved_at = 9;
}

message ConsumeInputTransferRequest {
  StageAuthority authority = 1;
  string ticket_id = 2;
  bytes token_digest = 3;
  bytes outcome_digest = 4;
  google.protobuf.Timestamp consumed_at = 5;
  string worker_instance_id = 6;
  int64 worker_instance_epoch = 7;
  string model_residency_id = 8;
  int64 model_runtime_epoch = 9;
  string connector_revision_id = 10;
}

message ResolvedInputTransfer {
  string ticket_id = 1;
  string stage_artifact_id = 2;
  string object_key = 3;
  string object_version = 4;
  bytes sha256 = 5;
  int64 size_bytes = 6;
  string content_type = 7;
}

message WorkerReadinessDecision {
  string worker_instance_id = 1;
  int64 worker_instance_epoch = 2;
  bool ready = 3;
  string reason = 4;
  int64 model_runtime_barrier_generation = 5;
  string leader_worker_member_id = 6;
}

message StageAssignment {
  StageAuthority authority = 1;
  StageExecutionSpec execution_spec = 2;
  repeated string required_worker_member_ids = 3;
  google.protobuf.Duration member_start_timeout = 4;
  repeated StageInputTransferTicket input_transfer_tickets = 5;
  repeated StageRootInputFetch root_input_fetches = 6;
}

message StageInputTransferTicket {
  string stage_artifact_id = 1;
  string object_version = 2;
  bytes transfer_ticket = 3;
}

message StageRootInputFetch {
  int32 condition_index = 1;
  bytes sha256 = 2;
  string download_url = 3;
}

message NoStageWork {
  google.protobuf.Duration retry_after = 1;
}

message StageCommandResult {
  bytes authority_digest = 1;
  StageWorkerCommandDecision decision = 2;
  StageWorkerOperation operation = 3;
  string detail = 4;
  StageAuthority renewed_authority = 5;
}

message StopStage {
  StageAuthority authority = 1;
  StageWorkerStopReason reason = 2;
  google.protobuf.Timestamp issued_at = 3;
}

message MaterializationAuthority {
  int32 schema_version = 1;
  bytes stage_authority_digest = 2;
  string stage_materialization_lease_id = 3;
  string stage_artifact_id = 4;
  string object_key = 5;
  string content_type = 6;
  bytes sha256 = 7;
  int64 size_bytes = 8;
  string local_receipt_id = 9;
  bytes local_receipt_digest = 10;
  string signing_key_id = 11;
  google.protobuf.Timestamp issued_at = 12;
  google.protobuf.Timestamp expires_at = 13;
  bytes token = 14;
  string source_worker_instance_id = 15;
  int64 source_worker_instance_epoch = 16;
  reserved 17;
  string source_worker_member_id = 18;
  bytes source_spiffe_id_digest = 19;
  int64 source_worker_member_epoch = 20;
}
