syntax = "proto3";

package vela.v1;

option go_package = "github.com/vivym/vela/proto/gen/vela/v1;velav1";

import "google/protobuf/timestamp.proto";

message EventEnvelope {
  string event_id = 1;
  string aggregate_type = 2;
  string aggregate_id = 3;
  uint64 aggregate_version = 4;
  string event_type = 5;
  uint32 schema_version = 6;
  google.protobuf.Timestamp occurred_at = 7;
  oneof payload {
    JobReady job_ready = 20;
    JobAssigned job_assigned = 21;
    JobStarted job_started = 22;
    JobRetryWait job_retry_wait = 23;
    JobFailed job_failed = 24;
    JobCanceled job_canceled = 25;
    JobCancelRequested job_cancel_requested = 26;
    JobCanceling job_canceling = 27;
    ChargePosted charge_posted = 28;
    InvoiceExportRequested invoice_export_requested = 29;
    JobSucceeded job_succeeded = 30;
  }
}

message JobReady {
  string organization_id = 1;
  string project_id = 2;
  string job_id = 3;
  string model_revision_id = 4;
  string generation_preset_revision_id = 5;
  string service_class_revision_id = 6;
  string output_spec_id = 7;
}

message JobAssigned {
  string organization_id = 1;
  string project_id = 2;
  string job_id = 3;
  string attempt_id = 4;
  uint32 attempt_number = 5;
  string worker_id = 6;
  uint64 worker_epoch = 7;
  string execution_profile_revision_id = 8;
  uint64 lease_fence = 9;
  google.protobuf.Timestamp lease_expires_at = 10;
}

message JobStarted {
  string organization_id = 1;
  string project_id = 2;
  string job_id = 3;
  string attempt_id = 4;
  uint32 attempt_number = 5;
  string worker_id = 6;
  uint64 worker_epoch = 7;
  uint64 lease_fence = 8;
  google.protobuf.Timestamp started_at = 9;
}

message JobRetryWait {
  reserved 6, 7;
  reserved "worker_id", "worker_epoch";

  string organization_id = 1;
  string project_id = 2;
  string job_id = 3;
  string attempt_id = 4;
  uint32 attempt_number = 5;
  uint64 attempt_fence = 8;
  uint64 job_fence = 9;
  string failure_class = 10;
  uint64 attempt_compute_seconds = 11;
  uint64 total_compute_seconds = 12;
  google.protobuf.Timestamp next_retry_at = 13;
  google.protobuf.Timestamp decided_at = 14;
  uint64 attempt_finalization_seconds = 15;
  uint64 total_finalization_seconds = 16;
}

message JobFailed {
  reserved 6, 7;
  reserved "worker_id", "worker_epoch";

  string organization_id = 1;
  string project_id = 2;
  string job_id = 3;
  string attempt_id = 4;
  uint32 attempt_number = 5;
  uint64 attempt_fence = 8;
  uint64 job_fence = 9;
  string failure_class = 10;
  string attempt_state = 11;
  uint64 attempt_compute_seconds = 12;
  uint64 total_compute_seconds = 13;
  google.protobuf.Timestamp decided_at = 14;
  uint64 attempt_finalization_seconds = 15;
  uint64 total_finalization_seconds = 16;
}

message JobCanceled {
  string organization_id = 1;
  string project_id = 2;
  string job_id = 3;
  string cancellation_id = 4;
  uint64 job_fence = 5;
  bool billable = 6;
  string charge_id = 7;
  google.protobuf.Timestamp decided_at = 8;
}

message JobCancelRequested {
  string organization_id = 1;
  string project_id = 2;
  string job_id = 3;
  string cancellation_id = 4;
  string attempt_id = 5;
  string worker_id = 6;
  uint64 worker_epoch = 7;
  uint64 attempt_fence = 8;
  uint64 cancellation_fence = 9;
  google.protobuf.Timestamp decided_at = 10;
  string authority_lease_id = 11;
  string authority_lease_phase = 12;
  string authority_lease_owner_kind = 13;
  string authority_lease_owner_id = 14;
  google.protobuf.Timestamp authority_lease_expires_at = 15;
}

message JobCanceling {
  string organization_id = 1;
  string project_id = 2;
  string job_id = 3;
  string cancellation_id = 4;
  uint64 cancellation_fence = 5;
  string charge_id = 6;
  google.protobuf.Timestamp decided_at = 7;
}

message ChargePosted {
  string organization_id = 1;
  string project_id = 2;
  string job_id = 3;
  string charge_id = 4;
  string cancellation_id = 5;
  uint64 amount_minor = 6;
  string currency = 7;
  string reason = 8;
  google.protobuf.Timestamp posted_at = 9;
}

message InvoiceExportRequested {
  string organization_id = 1;
  string project_id = 2;
  string job_id = 3;
  string charge_id = 4;
  google.protobuf.Timestamp requested_at = 5;
}

message ArtifactSnapshot {
  string artifact_id = 1;
  string kind = 2;
  uint32 ordinal = 3;
  string object_key = 4;
  string object_version_id = 5;
  uint64 size_bytes = 6;
  bytes sha256 = 7;
  string content_type = 8;
}

message JobSucceeded {
  string organization_id = 1;
  string project_id = 2;
  string job_id = 3;
  string attempt_id = 4;
  uint64 attempt_fence = 5;
  string artifact_set_id = 6;
  bytes manifest_sha256 = 7;
  string charge_id = 8;
  repeated ArtifactSnapshot artifacts = 9;
  google.protobuf.Timestamp completed_at = 10;
}
