syntax = "proto3";

package vela.v1;

option go_package = "github.com/vivym/vela/proto/gen/vela/v1;velav1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";
import "vela/v1/fleet_maintenance.proto";

service WorkerControlService {
  rpc Connect(stream ConnectRequest) returns (stream ConnectResponse);
}

service NodeAgentService {
  rpc ExecuteRemediation(ExecuteRemediationRequest)
      returns (ExecuteRemediationResponse);
}

message ConnectRequest {
  string request_id = 1;
  oneof operation {
    AcquireRequest acquire = 10;
    StartWorkerRequest start = 11;
    HeartbeatRequest heartbeat = 12;
    FailRequest fail = 13;
    ReportWorkerCapacityRequest report_capacity = 14;
    GetWorkerReadinessRequest get_readiness_work = 15;
    ReportWorkerReadinessRequest report_readiness = 16;
    BeginFinalizationRequest begin_finalization = 20;
    ClaimArtifactUploadRequest claim_artifact_upload = 21;
    RecordArtifactMultipartSessionRequest record_artifact_multipart_session = 22;
    RecordArtifactUploadedRequest record_artifact_uploaded = 23;
    VerifyArtifactRequest verify_artifact = 24;
    CompleteVisibleCompletionRequest complete_visible_completion = 25;
    CompleteArtifactMultipartUploadRequest complete_artifact_multipart_upload = 26;
    ClaimDebugDumpUploadRequest claim_debug_dump_upload = 27;
    RecordDebugDumpMultipartSessionRequest record_debug_dump_multipart_session = 28;
    CompleteDebugDumpMultipartUploadRequest complete_debug_dump_multipart_upload = 29;
  }
}

message ConnectResponse {
  string request_id = 1;
  oneof result {
    WorkerAssignment assignment = 10;
    StartWorkerResult start_result = 11;
    HeartbeatResult heartbeat_result = 12;
    RetryDecision retry_decision = 13;
    ReportWorkerCapacityResult capacity_result = 14;
    WorkerReadinessWork readiness_work = 15;
    WorkerReadinessResult readiness_result = 16;
    FinalizationPlan finalization_plan = 20;
    ArtifactUploadClaim artifact_upload_claim = 21;
    ArtifactMultipartSession artifact_multipart_session = 22;
    ArtifactUploadResult artifact_upload_result = 23;
    ArtifactVerificationResult artifact_verification_result = 24;
    VisibleCompletionResult visible_completion_result = 25;
    DebugDumpUploadClaim debug_dump_upload_claim = 26;
    DebugDumpMultipartSession debug_dump_multipart_session = 27;
    DebugDumpUploadResult debug_dump_upload_result = 28;
    WorkerOperationError operation_error = 99;
  }
}

message WorkerOperationError {
  string code = 1;
  string message = 2;
}

message ExecuteRemediationRequest {
  string operation_id = 1;
  string worker_id = 2;
  int64 worker_epoch = 3;
  string node_identity = 4;
  string device_identity = 5;
  string action_level = 6;
  string certification_revision = 7;
  bytes failure_evidence_digest = 8;
  google.protobuf.Timestamp deadline_at = 9;
  string execution_claim_id = 10;
  string failure_class = 11;
}

message ExecuteRemediationResponse {
  string operation_id = 1;
  bool success = 2;
  string result_code = 3;
  string result_detail = 4;
  bytes postcheck_sha256 = 5;
  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp finished_at = 7;
}

message WorkerLeaseCredentials {
  string attempt_id = 1;
  int64 worker_epoch = 2;
  int64 fence = 3;
  string token = 4;
}

message AcquireRequest {
  int64 worker_epoch = 1;
}

message ReportWorkerCapacityRequest {
  int64 worker_epoch = 1;
  int64 observation_sequence = 2;
  int64 total_bytes = 3;
  int64 free_bytes = 4;
  int64 high_watermark_bytes = 5;
  int64 low_watermark_bytes = 6;
  int64 critical_free_bytes = 7;
  bool artifact_store_reachable = 8;
  google.protobuf.Timestamp observed_at = 9;
  FleetScratchWatermarkState watermark_state = 10;
}

message ReportWorkerCapacityResult {
  string worker_pool_id = 1;
  bool replayed = 2;
  string worker_state = 3;
  string pool_state = 4;
  bool worker_assignment_allowed = 5;
  bool pool_assignment_allowed = 6;
  bool pool_readiness_allowed = 7;
}

message GetWorkerReadinessRequest {
  int64 worker_epoch = 1;
}

message ReportWorkerReadinessRequest {
  int64 worker_epoch = 1;
  string cycle_id = 2;
  FleetReadinessCheck check = 3;
  bool passed = 4;
  bytes evidence_digest = 5;
}

message WorkerReadinessWork {
  bool available = 1;
  string cycle_id = 2;
  FleetReadinessCheck check = 3;
  string worker_id = 4;
  string worker_pool_id = 5;
  int64 worker_epoch = 6;
  string node_identity = 7;
  string execution_profile_revision_id = 8;
  string inference_backend_revision = 9;
  google.protobuf.Timestamp deadline = 10;
}

message WorkerReadinessResult {
  string cycle_id = 1;
  bool replayed = 2;
  FleetReadinessState state = 3;
  FleetReadinessCheck next_check = 4;
  FleetWorkerLifecycle worker_lifecycle = 5;
  FleetWorkerReachability worker_reachability = 6;
}

message WorkerAssignment {
  string attempt_id = 1;
  string job_id = 2;
  string worker_id = 3;
  int64 worker_epoch = 4;
  string model_revision_id = 5;
  string generation_preset_revision_id = 6;
  string execution_profile_revision_id = 7;
  string output_spec_id = 8;
  bytes request_content_json = 9;
  int32 attempt_number = 10;
  string lease_token = 11;
  int64 lease_fence = 12;
  google.protobuf.Timestamp lease_expires_at = 13;
  google.protobuf.Duration lease_valid_for = 14;
  DebugDumpAuthorizationSnapshot debug_dump_authorization = 15;
}

message DebugDumpAuthorizationSnapshot {
  string authorization_id = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message StartWorkerRequest {
  WorkerLeaseCredentials lease = 1;
}

message StartWorkerResult {
  string decision = 1;
  string stop_reason = 2;
  string attempt_id = 3;
  string job_id = 4;
  string worker_id = 5;
  int64 worker_epoch = 6;
  int64 lease_fence = 7;
  google.protobuf.Timestamp started_at = 8;
}

message HeartbeatRequest {
  WorkerLeaseCredentials lease = 1;
  int64 sequence = 2;
  string backend_stage = 3;
  optional double backend_stage_progress = 4;
  optional int64 estimated_remaining_seconds = 5;
  bytes gpu_health_json = 6;
  bytes local_artifact_state_json = 7;
  int64 scratch_free_bytes = 8;
  bool artifact_store_reachable = 9;
}

message HeartbeatResult {
  string decision = 1;
  string stop_reason = 2;
  string attempt_id = 3;
  string job_id = 4;
  string worker_id = 5;
  int64 worker_epoch = 6;
  int64 lease_fence = 7;
  int64 heartbeat_sequence = 8;
  string execution_phase = 9;
  google.protobuf.Timestamp progress_updated_at = 10;
  google.protobuf.Timestamp lease_expires_at = 11;
  google.protobuf.Duration lease_valid_for = 12;
}

message FailRequest {
  WorkerLeaseCredentials lease = 1;
  WorkerFailureObservation observation = 2;
}

message WorkerFailureObservation {
  string failure_class = 1;
  string failure_fingerprint = 2;
  string error_summary = 3;
  string backend_stage = 4;
  repeated string gpu_uuids = 5;
  string inference_backend_revision = 6;
  bool retry_recommended = 7;
  bool worker_reusable = 8;
}

message RetryDecision {
  string disposition = 1;
  string failure_class = 2;
  string attempt_id = 3;
  string job_id = 4;
  string attempt_state = 5;
  int64 attempt_compute_seconds = 6;
  int64 total_compute_seconds = 7;
  int64 attempt_finalization_seconds = 8;
  int64 total_finalization_seconds = 9;
  google.protobuf.Timestamp next_retry_at = 10;
  int64 job_fence = 11;
  int64 job_version = 12;
  google.protobuf.Timestamp decided_at = 13;
}

message BeginFinalizationRequest {
  WorkerLeaseCredentials lease = 1;
}

message ClaimArtifactUploadRequest {
  WorkerLeaseCredentials lease = 1;
  string upload_id = 2;
  string claim_id = 3;
  ArtifactUploadPartIntent part = 4;
}

message ArtifactUploadPartIntent {
  int32 number = 1;
  int64 size_bytes = 2;
  bytes sha256 = 3;
}

message RecordArtifactMultipartSessionRequest {
  WorkerLeaseCredentials lease = 1;
  string upload_id = 2;
  string claim_id = 3;
  string multipart_upload_id = 4;
}

message ArtifactUploadPartReport {
  int32 number = 1;
  string etag = 2;
  int64 size_bytes = 3;
  bytes checksum_sha256 = 4;
}

message ArtifactUploadReport {
  string object_version_id = 1;
  int64 size_bytes = 2;
  bytes sha256 = 3;
  string content_type = 4;
  repeated ArtifactUploadPartReport completed_parts = 5;
}

message RecordArtifactUploadedRequest {
  WorkerLeaseCredentials lease = 1;
  string upload_id = 2;
  ArtifactUploadReport report = 3;
}

message CompleteArtifactMultipartUploadRequest {
  WorkerLeaseCredentials lease = 1;
  string upload_id = 2;
  string claim_id = 3;
  int64 size_bytes = 4;
  bytes sha256 = 5;
  string content_type = 6;
  repeated ArtifactUploadPartReport completed_parts = 7;
}

message ClaimDebugDumpUploadRequest {
  WorkerLeaseCredentials lease = 1;
  string debug_dump_id = 2;
  string authorization_id = 3;
  int64 size_bytes = 4;
  bytes sha256 = 5;
  string content_type = 6;
  DebugDumpUploadPartIntent part = 7;
  string claim_id = 8;
}

message DebugDumpUploadPartIntent {
  int32 number = 1;
  int64 size_bytes = 2;
  bytes sha256 = 3;
}

message RecordDebugDumpMultipartSessionRequest {
  WorkerLeaseCredentials lease = 1;
  string debug_dump_id = 2;
  string claim_id = 3;
  string multipart_upload_id = 4;
}

message DebugDumpUploadPartReport {
  int32 number = 1;
  string etag = 2;
  int64 size_bytes = 3;
  bytes checksum_sha256 = 4;
}

message CompleteDebugDumpMultipartUploadRequest {
  WorkerLeaseCredentials lease = 1;
  string debug_dump_id = 2;
  string claim_id = 3;
  string authorization_id = 4;
  int64 size_bytes = 5;
  bytes sha256 = 6;
  string content_type = 7;
  repeated DebugDumpUploadPartReport completed_parts = 8;
}

message VerifyArtifactRequest {
  WorkerLeaseCredentials lease = 1;
  string upload_id = 2;
  string verification_id = 3;
}

message VisibleCompletionCandidate {
  string completion_id = 1;
  int64 expected_job_version = 2;
  repeated string artifact_ids = 3;
}

message CompleteVisibleCompletionRequest {
  WorkerLeaseCredentials lease = 1;
  VisibleCompletionCandidate candidate = 2;
}

message PlannedArtifact {
  string artifact_id = 1;
  string upload_id = 2;
  string kind = 3;
  int32 ordinal = 4;
  string object_key = 5;
  google.protobuf.Timestamp expires_at = 6;
}

message FinalizationPlan {
  string decision = 1;
  string attempt_id = 2;
  string job_id = 3;
  int64 job_version = 4;
  google.protobuf.Timestamp finalization_started_at = 5;
  google.protobuf.Timestamp finalization_deadline_at = 6;
  repeated PlannedArtifact artifacts = 7;
}

message ArtifactUploadClaim {
  string decision = 1;
  string claim_id = 2;
  string upload_id = 3;
  string artifact_id = 4;
  string object_key = 5;
  string expected_content_type = 6;
  google.protobuf.Timestamp claim_expires_at = 7;
  int64 version = 8;
  string multipart_upload_id = 9;
  repeated ArtifactUploadPartReport completed_parts = 10;
  SignedArtifactUploadPart upload_part = 11;
  google.protobuf.Timestamp upload_expires_at = 12;
  bool part_already_uploaded = 13;
}

message SignedArtifactUploadPart {
  int32 number = 1;
  int64 size_bytes = 2;
  bytes sha256 = 3;
  string url = 4;
  map<string, string> required_headers = 5;
  google.protobuf.Timestamp expires_at = 6;
}

message ArtifactMultipartSession {
  string decision = 1;
  string upload_id = 2;
  string artifact_id = 3;
  string multipart_upload_id = 4;
  int64 version = 5;
}

message ArtifactUploadResult {
  string decision = 1;
  string upload_id = 2;
  string artifact_id = 3;
  string object_version_id = 4;
  int64 version = 5;
}

message DebugDumpUploadClaim {
  string decision = 1;
  string claim_id = 2;
  string debug_dump_id = 3;
  string authorization_id = 4;
  string object_key = 5;
  int64 expected_size_bytes = 6;
  bytes expected_sha256 = 7;
  string expected_content_type = 8;
  google.protobuf.Timestamp claim_expires_at = 9;
  google.protobuf.Timestamp upload_expires_at = 10;
  int64 version = 11;
  string multipart_upload_id = 12;
  repeated DebugDumpUploadPartReport completed_parts = 13;
  SignedDebugDumpUploadPart upload_part = 14;
  bool part_already_uploaded = 15;
}

message SignedDebugDumpUploadPart {
  int32 number = 1;
  int64 size_bytes = 2;
  bytes sha256 = 3;
  string url = 4;
  map<string, string> required_headers = 5;
  google.protobuf.Timestamp expires_at = 6;
}

message DebugDumpMultipartSession {
  string decision = 1;
  string debug_dump_id = 2;
  string authorization_id = 3;
  string multipart_upload_id = 4;
  int64 version = 5;
}

message DebugDumpUploadResult {
  string decision = 1;
  string debug_dump_id = 2;
  string authorization_id = 3;
  string object_version_id = 4;
  int64 version = 5;
}

message ArtifactVerificationResult {
  string decision = 1;
  string verification_id = 2;
  string upload_id = 3;
  string artifact_id = 4;
  string object_version_id = 5;
  int64 version = 6;
  google.protobuf.Timestamp verified_at = 7;
}

message WorkerCommittedArtifact {
  string artifact_id = 1;
  string kind = 2;
  int32 ordinal = 3;
  string object_key = 4;
  string object_version_id = 5;
  int64 size_bytes = 6;
  bytes sha256 = 7;
  string content_type = 8;
}

message VisibleCompletionResult {
  string decision = 1;
  string completion_id = 2;
  string job_id = 3;
  string attempt_id = 4;
  string artifact_set_id = 5;
  string charge_id = 6;
  int64 job_version = 7;
  bytes manifest_sha256 = 8;
  repeated WorkerCommittedArtifact artifacts = 9;
  google.protobuf.Timestamp completed_at = 10;
}
