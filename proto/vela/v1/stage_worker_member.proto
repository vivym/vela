syntax = "proto3";

package vela.v1;

import "vela/v1/model_runtime.proto";

option go_package = "github.com/vivym/vela/proto/gen/vela/v1;velav1";

service StageWorkerMemberService {
  rpc PrepareStage(StageWorkerMemberServicePrepareStageRequest)
      returns (StageWorkerMemberServicePrepareStageResponse);
  rpc StartStage(StageWorkerMemberServiceStartStageRequest)
      returns (StageWorkerMemberServiceStartStageResponse);
  rpc CancelStage(StageWorkerMemberServiceCancelStageRequest)
      returns (StageWorkerMemberServiceCancelStageResponse);
  rpc Status(StageWorkerMemberServiceStatusRequest)
      returns (StageWorkerMemberServiceStatusResponse);
  rpc InspectExecution(StageWorkerMemberServiceInspectExecutionRequest)
      returns (StageWorkerMemberServiceInspectExecutionResponse);
  rpc DrainStageExecution(StageWorkerMemberServiceDrainStageExecutionRequest)
      returns (StageWorkerMemberServiceDrainStageExecutionResponse);
  rpc InspectStageExecutionDrain(StageWorkerMemberServiceInspectStageExecutionDrainRequest)
      returns (StageWorkerMemberServiceInspectStageExecutionDrainResponse);
  rpc InspectStageAllocationDrain(StageWorkerMemberServiceInspectStageAllocationDrainRequest)
      returns (StageWorkerMemberServiceInspectStageAllocationDrainResponse);
  rpc InstallStageExecutionFloor(StageWorkerMemberServiceInstallStageExecutionFloorRequest)
      returns (StageWorkerMemberServiceInstallStageExecutionFloorResponse);
}

message StageWorkerMemberServicePrepareStageRequest {
  string target_worker_member_id = 1;
  ModelRuntimeServicePrepareStageRequest command = 2;
}

message StageWorkerMemberServicePrepareStageResponse {
  ModelRuntimeServicePrepareStageResponse result = 1;
}

message StageWorkerMemberServiceStartStageRequest {
  string target_worker_member_id = 1;
  ModelRuntimeServiceStartStageRequest command = 2;
}

message StageWorkerMemberServiceStartStageResponse {
  ModelRuntimeServiceStartStageResponse result = 1;
}

message StageWorkerMemberServiceCancelStageRequest {
  string target_worker_member_id = 1;
  ModelRuntimeServiceCancelStageRequest command = 2;
}

message StageWorkerMemberServiceCancelStageResponse {
  ModelRuntimeServiceCancelStageResponse result = 1;
}

message StageWorkerMemberServiceStatusRequest {
  string target_worker_member_id = 1;
  ModelRuntimeServiceStatusRequest command = 2;
}

message StageWorkerMemberServiceStatusResponse {
  ModelRuntimeServiceStatusResponse result = 1;
}

message StageWorkerMemberServiceInspectExecutionRequest {
  string target_worker_member_id = 1;
  ModelRuntimeServiceInspectExecutionRequest command = 2;
}

message StageWorkerMemberServiceInspectExecutionResponse {
  ModelRuntimeServiceInspectExecutionResponse result = 1;
}

message StageWorkerMemberServiceInstallStageExecutionFloorRequest {
  string target_worker_member_id = 1;
  ModelRuntimeServiceInstallStageExecutionFloorRequest command = 2;
}

message StageWorkerMemberServiceDrainStageExecutionRequest {
  string target_worker_member_id = 1;
  ModelRuntimeServiceDrainStageExecutionRequest command = 2;
}

message StageWorkerMemberServiceDrainStageExecutionResponse {
  ModelRuntimeServiceDrainStageExecutionResponse result = 1;
}

message StageWorkerMemberServiceInspectStageExecutionDrainRequest {
  string target_worker_member_id = 1;
  ModelRuntimeServiceInspectStageExecutionDrainRequest command = 2;
}

message StageWorkerMemberServiceInspectStageExecutionDrainResponse {
  ModelRuntimeServiceInspectStageExecutionDrainResponse result = 1;
}

message StageWorkerMemberServiceInspectStageAllocationDrainRequest {
  string target_worker_member_id = 1;
  ModelRuntimeServiceInspectStageAllocationDrainRequest command = 2;
}

message StageWorkerMemberServiceInspectStageAllocationDrainResponse {
  ModelRuntimeServiceInspectStageAllocationDrainResponse result = 1;
}

message StageWorkerMemberServiceInstallStageExecutionFloorResponse {
  ModelRuntimeServiceInstallStageExecutionFloorResponse result = 1;
}
