syntax = "proto3";

package vela.v1;

option go_package = "github.com/vivym/vela/proto/gen/vela/v1;velav1";

service FleetMaintenanceService {
  rpc ApplyResidencyPlan(ApplyResidencyPlanRequest)
      returns (ApplyResidencyPlanResponse);
  rpc ObserveWorkerInstance(ObserveWorkerInstanceRequest)
      returns (ObserveWorkerInstanceResponse);
  rpc AuthorizeMutation(AuthorizeMutationRequest)
      returns (AuthorizeMutationResponse);
}

message ApplyResidencyPlanRequest {
  bytes approved_plan_json = 1;
}

message ApplyResidencyPlanResponse {
  string plan_revision_id = 1;
  int32 worker_instance_count = 2;
}

message ObserveWorkerInstanceRequest {
  bytes evidence_json = 1;
}

message ObserveWorkerInstanceResponse {
  string worker_instance_id = 1;
  int64 instance_epoch = 2;
  int64 control_session_epoch = 3;
  int64 model_runtime_epoch = 4;
  string readiness = 5;
}

enum FleetMutationOperation {
  FLEET_MUTATION_OPERATION_UNSPECIFIED = 0;
  FLEET_MUTATION_OPERATION_DELETE = 1;
  FLEET_MUTATION_OPERATION_REMOVE_FINALIZER = 4;
  reserved 2, 3;
}

message AuthorizeMutationRequest {
  string request_uid = 1;
  reserved 2;
  FleetMutationOperation operation = 3;
  string kubernetes_uid = 4;
  string namespace = 5;
  string name = 6;
  reserved 7, 8, 9, 10;
  bytes request_digest = 11;
  string worker_instance_id = 12;
  int64 worker_instance_epoch = 13;
  string residency_plan_revision_id = 14;
  string worker_bundle_id = 15;
  string worker_member_id = 16;
}

message AuthorizeMutationResponse {
  string request_uid = 1;
  bool replayed = 2;
  bool authorized = 3;
}
