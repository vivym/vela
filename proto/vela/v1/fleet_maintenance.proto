syntax = "proto3";

package vela.v1;

option go_package = "github.com/vivym/vela/proto/gen/vela/v1;velav1";

import "google/protobuf/timestamp.proto";

service FleetMaintenanceService {
  rpc ApplyResidencyPlan(ApplyResidencyPlanRequest)
      returns (ApplyResidencyPlanResponse);
  rpc ObserveWorkerInstance(ObserveWorkerInstanceRequest)
      returns (ObserveWorkerInstanceResponse);
  rpc AuthorizeMutation(AuthorizeMutationRequest)
      returns (AuthorizeMutationResponse);
  rpc ClaimWorkerBootstrap(ClaimWorkerBootstrapRequest)
      returns (ClaimWorkerBootstrapResponse);
  rpc RecordWorkerBootstrapReceipt(RecordWorkerBootstrapReceiptRequest)
      returns (RecordWorkerBootstrapReceiptResponse);
  rpc LookupWorkerBootstrap(LookupWorkerBootstrapRequest)
      returns (LookupWorkerBootstrapResponse);
  rpc LookupWorkerBootstrapBinding(LookupWorkerBootstrapBindingRequest)
      returns (LookupWorkerBootstrapBindingResponse);
  rpc AbandonWorkerBootstrap(AbandonWorkerBootstrapRequest)
      returns (AbandonWorkerBootstrapResponse);
}

message ClaimWorkerBootstrapRequest {
  string request_id = 1;
  string worker_instance_id = 2;
  int64 worker_instance_epoch = 3;
  string worker_member_id = 4;
  bytes bundle_manifest = 5;
}

// History carries no reusable initialization permission.
message WorkerBootstrapClaim {
  string request_id = 1;
  string worker_instance_id = 2;
  int64 worker_instance_epoch = 3;
  string worker_member_id = 4;
  int64 worker_member_epoch = 5;
  string node_identity = 6;
  bytes bundle_digest = 7;
  google.protobuf.Timestamp claimed_at = 8;
  string actor_identity = 9;
}

message ClaimWorkerBootstrapResponse {
  WorkerBootstrapClaim claim = 1;
  // True only for the inserting committed RPC; never true on replay or lookup.
  bool fresh = 2;
}

message RecordWorkerBootstrapReceiptRequest {
  string request_id = 1;
  string worker_journal_id = 2;
  bytes worker_scope = 3;
  string runtime_journal_id = 4;
  bytes runtime_scope = 5;
}

message WorkerBootstrapJournalPair {
  string request_id = 1;
  string worker_journal_id = 2;
  bytes worker_scope = 3;
  string runtime_journal_id = 4;
  bytes runtime_scope = 5;
  google.protobuf.Timestamp recorded_at = 6;
  string actor_identity = 7;
}

message RecordWorkerBootstrapReceiptResponse {
  WorkerBootstrapJournalPair pair = 1;
}

message LookupWorkerBootstrapRequest {
  string request_id = 1;
}

message LookupWorkerBootstrapResponse {
  WorkerBootstrapClaim claim = 1;
  WorkerBootstrapJournalPair pair = 2;
  WorkerBootstrapAbandonment abandonment = 3;
}

// Permanent rejection of completion, not local process drain or replacement permission.
message WorkerBootstrapAbandonment {
  int64 fenced_instance_epoch = 1;
  google.protobuf.Timestamp abandoned_at = 2;
}

message AbandonWorkerBootstrapRequest {
  string request_id = 1;
}

message AbandonWorkerBootstrapResponse {
  WorkerBootstrapClaim claim = 1;
  WorkerBootstrapAbandonment abandonment = 2;
}

// Immutable journal identity evidence, not current readiness or execution authority.
message WorkerBootstrapBinding {
  uint32 schema_version = 1;
  WorkerBootstrapClaim claim = 2;
  WorkerBootstrapJournalPair pair = 3;
  string signing_key_id = 4;
  bytes signature = 5;
}

message LookupWorkerBootstrapBindingRequest {
  string request_id = 1;
}

message LookupWorkerBootstrapBindingResponse {
  WorkerBootstrapBinding binding = 1;
}

message ApplyResidencyPlanRequest {
  bytes approved_plan_json = 1;
}

message ApplyResidencyPlanResponse {
  string plan_revision_id = 1;
  int32 worker_instance_count = 2;
}

message ObserveWorkerInstanceRequest {
  bytes evidence_json = 1;
}

message ObserveWorkerInstanceResponse {
  string worker_instance_id = 1;
  int64 instance_epoch = 2;
  int64 control_session_epoch = 3;
  int64 model_runtime_epoch = 4;
  string readiness = 5;
}

enum FleetMutationOperation {
  FLEET_MUTATION_OPERATION_UNSPECIFIED = 0;
  FLEET_MUTATION_OPERATION_DELETE = 1;
  FLEET_MUTATION_OPERATION_REMOVE_FINALIZER = 4;
  reserved 2, 3;
}

message AuthorizeMutationRequest {
  string request_uid = 1;
  reserved 2;
  FleetMutationOperation operation = 3;
  string kubernetes_uid = 4;
  string namespace = 5;
  string name = 6;
  reserved 7, 8, 9, 10;
  bytes request_digest = 11;
  string worker_instance_id = 12;
  int64 worker_instance_epoch = 13;
  string residency_plan_revision_id = 14;
  string worker_bundle_id = 15;
  string worker_member_id = 16;
}

message AuthorizeMutationResponse {
  string request_uid = 1;
  bool replayed = 2;
  bool authorized = 3;
}
