apiVersion: batch/v1
kind: CronJob
metadata:
  name: vela-gateway-tls-sync
  labels:
    app.kubernetes.io/part-of: vela
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 240
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      activeDeadlineSeconds: 180
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: vela-gateway-tls-sync
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector:
            vela.ai/control-plane-tier: cpu
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sync
              image: docker.io/curlimages/curl@sha256:5a91ea0c9c3ee27b4abe657b68cf6bf0676afa13b236b3bda34283cb3924d4f6
              imagePullPolicy: IfNotPresent
              command: [/bin/sh, /scripts/sync.sh]
              env:
                - name: APISIX_ADMIN
                  valueFrom:
                    secretKeyRef:
                      name: apisix-admin-credentials
                      key: admin
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: tls
                  mountPath: /tls
                  readOnly: true
                - name: work
                  mountPath: /work
          volumes:
            - name: scripts
              configMap:
                name: vela-gateway-tls-sync
            - name: tls
              secret:
                secretName: vela-gateway-tls
                defaultMode: 0440
            - name: work
              emptyDir:
                medium: Memory
                sizeLimit: 8Mi
