grafana:
  enabled: true
  # Grafana uses a single Longhorn ReadWriteOnce PVC; keep one replica unless
  # the storage class is changed to RWX.
  replicas: 1
  deploymentStrategy:
    type: Recreate
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  grafana.ini:
    server:
      # APISIX removes /grafana before forwarding. Advertise the external
      # path for assets and redirects, but keep backend endpoints at /.
      root_url: /grafana/
      serve_from_sub_path: false
  persistence:
    enabled: true
    storageClassName: longhorn
    size: 20Gi
  nodeSelector:
    vela.ai/management: "true"
  tolerations: []
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
  service:
    type: ClusterIP
defaultRules:
  # The chart's direct kube-proxy scraper cannot reach RKE2 loopback metrics.
  # node-local-metrics.yaml supplies authenticated collection with the original
  # job labels. infrastructure-rules.yaml covers per-node failure/disappearance
  # instead of the chart's cluster-wide KubeProxyDown absence check.
  rules:
    kubeProxy: false
prometheus:
  prometheusSpec:
    retention: 15d
    retentionSize: 40GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi
    nodeSelector:
      vela.ai/management: "true"
    tolerations: []
    additionalScrapeConfigs:
      - job_name: nvidia-smi
        scrape_interval: 30s
        scrape_timeout: 10s
        static_configs:
