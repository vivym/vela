alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
    nodeSelector:
      vela.ai/management: "true"
    tolerations: []
nodeExporter:
  enabled: true
prometheusOperator:
  nodeSelector:
    vela.ai/management: "true"
  tolerations: []
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
prometheus-node-exporter:
  hostNetwork: false
  hostPID: true
  # Keep host telemetry alive during DiskPressure so the pressure source
  # remains observable. This does not grant the exporter write access.
  priorityClassName: system-node-critical
  service:
    port: 9100
    targetPort: 9100
kubeStateMetrics:
  enabled: true
kube-state-metrics:
  image:
    registry: 10.1.201.70:5004
    repository: kube-state-metrics/kube-state-metrics
    tag: v2.20.0
  nodeSelector:
    vela.ai/management: "true"
