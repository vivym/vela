# Query strings contain signed download credentials; keep them out of this log.
log_format vela_domain '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent $request_time';

server {
    listen 80;
    listen [::]:80;
    server_name vela.marslab.ic;
    access_log /var/log/nginx/vela.marslab.ic.access.log vela_domain;
    return 308 https://vela.marslab.ic$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name vela.marslab.ic;

    ssl_certificate     /etc/nginx/ssl/ragflow.marslab.ic/wildcard.marslab.ic.crt;
    ssl_certificate_key /etc/nginx/ssl/ragflow.marslab.ic/wildcard.marslab.ic.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/vela.marslab.ic.access.log vela_domain;
    error_log /var/log/nginx/vela.marslab.ic.error.log warn;

    client_max_body_size 1m;
    proxy_connect_timeout 5s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    # This identity is already covered by the APISIX certificate and SNI config.
    proxy_ssl_name apisix-gateway.apisix.svc.cluster.local;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/nginx/ssl/ragflow.marslab.ic/current/ca.crt;
    proxy_ssl_verify_depth 2;
    # Preserve the signed public Host, URI and query all the way to MinIO.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";

    location /api/ {
        proxy_pass https://127.0.0.1:30443;
    }
    # Public Qwen3 API. APISIX performs API-key authentication and rate
    # limiting; Nginx only terminates the public TLS connection and forwards
    # the original URI to the gateway.
    location = /qwen3 { return 308 /qwen3/; }
    location /qwen3/ {
        proxy_pass https://127.0.0.1:30443;
    }
    location /vela-artifacts/artifacts/ {
        if ($request_method != GET) { return 405; }
        proxy_pass https://127.0.0.1:30443;
    }
    location / {
        return 404;
    }
}
