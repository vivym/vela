apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: qwen3-from-ragflow
  namespace: llm-models
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: qwen3-model-worker}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ragflow-lab}
      ports: [{protocol: TCP, port: 8080}]
