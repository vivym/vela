apiVersion: v1
kind: PersistentVolume
metadata:
  name: qwen3-models-server-53
  labels:
    app.kubernetes.io/name: qwen3-model-worker
    vela.ai/storage-purpose: model-cache
spec:
  capacity:
    storage: 40Gi
  volumeMode: Filesystem
  accessModes: [ReadOnlyMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: qwen3-model-local
  local:
    path: /home/user/models/Qwen
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [server-53]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen3-models
  namespace: llm-models
  labels:
    app.kubernetes.io/name: qwen3-model-worker
spec:
  accessModes: [ReadOnlyMany]
  storageClassName: qwen3-model-local
  resources:
    requests:
      storage: 40Gi
