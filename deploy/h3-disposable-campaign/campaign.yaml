apiVersion: v1
kind: Namespace
metadata:
  name: vela-h3-disposable
  labels:
    app.kubernetes.io/part-of: vela
    vela.ai/evidence-scope: disposable-fake-runtime-member-transport
---
apiVersion: v1
kind: Service
metadata:
  name: follower
  namespace: vela-h3-disposable
  labels:
    app.kubernetes.io/name: vela-h3-member-campaign
    app.kubernetes.io/component: follower
spec:
  selector:
    app.kubernetes.io/name: vela-h3-member-campaign
    app.kubernetes.io/component: follower
  ports:
    - name: member-grpc
      port: 7444
      protocol: TCP
      targetPort: member-grpc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: follower
  namespace: vela-h3-disposable
  labels:
    app.kubernetes.io/name: vela-h3-member-campaign
    app.kubernetes.io/component: follower
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vela-h3-member-campaign
      app.kubernetes.io/component: follower
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vela-h3-member-campaign
        app.kubernetes.io/component: follower
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        vela.ai/h3-campaign-role: follower
      restartPolicy: Always
      terminationGracePeriodSeconds: 10
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: campaign
          image: vela-h3-member-campaign:disposable
          imagePullPolicy: Never
          args:
            - serve
          env:
            - name: VELA_H3_MEMBER_CAMPAIGN_LISTEN_ADDRESS
              value: 0.0.0.0:7444
            - name: VELA_H3_MEMBER_CAMPAIGN_SERVER_TLS_CERT_FILE
              value: /run/campaign/server.crt
            - name: VELA_H3_MEMBER_CAMPAIGN_SERVER_TLS_KEY_FILE
              value: /run/campaign/server.key
            - name: VELA_H3_MEMBER_CAMPAIGN_CLIENT_CA_FILE
              value: /run/campaign/ca.crt
            - name: VELA_H3_MEMBER_CAMPAIGN_AUTHORITY_KEY_FILE
              value: /run/campaign/authority.key
          ports:
            - name: member-grpc
              containerPort: 7444
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: member-grpc
            initialDelaySeconds: 1
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: member-grpc
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 6
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 1
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: credentials
              mountPath: /run/campaign
              readOnly: true
      volumes:
        - name: credentials
          secret:
            secretName: vela-h3-member-campaign-credentials
            defaultMode: 0400
