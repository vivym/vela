apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vela-fleet-controller
  namespace: vela-system
  labels:
    app.kubernetes.io/name: vela-fleet-controller
    app.kubernetes.io/part-of: vela
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - get
      - create
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - create
  - apiGroups:
      - resource.k8s.io
    resources:
      - resourceclaimtemplates
    verbs:
      - get
      - list
      - watch
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vela-fleet-controller
  namespace: vela-system
  labels:
    app.kubernetes.io/name: vela-fleet-controller
    app.kubernetes.io/part-of: vela
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vela-fleet-controller
subjects:
  - kind: ServiceAccount
    name: vela-fleet-controller
    namespace: vela-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vela-fleet-controller-node-reader
  labels:
    app.kubernetes.io/name: vela-fleet-controller
    app.kubernetes.io/part-of: vela
rules:
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vela-fleet-controller-node-reader
  labels:
    app.kubernetes.io/name: vela-fleet-controller
    app.kubernetes.io/part-of: vela
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vela-fleet-controller-node-reader
subjects:
  - kind: ServiceAccount
    name: vela-fleet-controller
    namespace: vela-system
