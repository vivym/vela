apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: workerpools.fleet.vela.ai
  labels:
    app.kubernetes.io/name: vela-fleet-controller
    app.kubernetes.io/part-of: vela
spec:
  group: fleet.vela.ai
  scope: Namespaced
  names:
    kind: WorkerPool
    listKind: WorkerPoolList
    plural: workerpools
    singular: workerpool
    shortNames:
      - vwp
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Profile
          type: string
          jsonPath: .spec.workerProfile
        - name: Revision
          type: string
          jsonPath: .spec.revision
        - name: Ready
          type: integer
          jsonPath: .status.readyWorkers
      schema:
        openAPIV3Schema:
          type: object
          required:
            - apiVersion
            - kind
            - metadata
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - capacityPolicy
                - nodeSelector
                - placements
                - revision
                - workerProfile
              x-kubernetes-validations:
                - rule: self == oldSelf
                  message: WorkerPool spec is immutable; create a new revision instead
              properties:
                revision:
                  type: string
                  pattern: ^[0-9a-f]{64}$
                workerProfile:
                  type: string
                  enum:
                    - h3
                nodeSelector:
                  type: object
                  minProperties: 2
                  maxProperties: 64
                  additionalProperties:
                    type: string
                    maxLength: 63
                    pattern: ^(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])?$
                  x-kubernetes-validations:
                    - rule: "'vela.ai/worker-profile' in self && self['vela.ai/worker-profile'] == 'h3'"
                      message: nodeSelector must select the h3 Worker profile
                    - rule: "'vela.ai/worker-pool' in self && size(self['vela.ai/worker-pool']) > 0"
                      message: nodeSelector must select one Worker pool
                    - rule: "!('kubernetes.io/hostname' in self)"
                      message: nodeSelector hostname is owned by each placement
                placements:
                  type: array
                  minItems: 1
                  maxItems: 1024
                  items:
                    type: object
                    required:
                      - daemonSetName
                      - nodeIdentity
                      - runnerGPURolesConfigMap
                      - runnerProfilesConfigMap
                      - workerControlTLSSecret
                      - workerRuntimeConfigMap
                    properties:
                      nodeIdentity:
                        type: string
                        minLength: 1
                        maxLength: 63
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                      daemonSetName:
                        type: string
                        minLength: 1
                        maxLength: 63
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                      workerRuntimeConfigMap:
                        type: string
                        minLength: 1
                        maxLength: 253
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                      runnerProfilesConfigMap:
                        type: string
                        minLength: 1
                        maxLength: 253
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                      runnerGPURolesConfigMap:
                        type: string
                        minLength: 1
                        maxLength: 253
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                      workerControlTLSSecret:
                        type: string
                        minLength: 1
                        maxLength: 253
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                capacityPolicy:
                  type: object
                  required:
                    - observationMaxAgeSeconds
                    - poolHighWatermarkBytes
                    - poolLowWatermarkBytes
                    - workerCriticalFreeBytes
                    - workerHighWatermarkBytes
                    - workerLowWatermarkBytes
                  x-kubernetes-validations:
                    - rule: self.workerLowWatermarkBytes < self.workerHighWatermarkBytes
                      message: Worker low watermark must be below the high watermark
                    - rule: self.poolLowWatermarkBytes < self.poolHighWatermarkBytes
                      message: pool low watermark must be below the high watermark
                  properties:
                    workerHighWatermarkBytes:
                      type: integer
                      format: int64
                      minimum: 1
                    workerLowWatermarkBytes:
                      type: integer
                      format: int64
                      minimum: 0
                    workerCriticalFreeBytes:
                      type: integer
                      format: int64
                      minimum: 0
                    poolHighWatermarkBytes:
                      type: integer
                      format: int64
                      minimum: 1
                    poolLowWatermarkBytes:
                      type: integer
                      format: int64
                      minimum: 0
                    observationMaxAgeSeconds:
                      type: integer
                      format: int64
                      minimum: 10
                      maximum: 600
            status:
              type: object
              properties:
                observedRevision:
                  type: string
                  pattern: ^[0-9a-f]{64}$
                desiredWorkers:
                  type: integer
                  format: int32
                  minimum: 0
                readyWorkers:
                  type: integer
                  format: int32
                  minimum: 0
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      reason:
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
