apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: vela-observability
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: vela-observability
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-ingress
  namespace: vela-observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vela-lab-prometheus
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vela-lab-grafana
      ports:
        - {protocol: TCP, port: 9090}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-egress
  namespace: vela-observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vela-lab-prometheus
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vela-lab
          podSelector:
            matchLabels:
              app.kubernetes.io/component: control-plane
      ports:
        - {protocol: TCP, port: 8081}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vela-lab-alertmanager
      ports:
        - {protocol: TCP, port: 9093}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alertmanager-ingress
  namespace: vela-observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vela-lab-alertmanager
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vela-lab-prometheus
      ports:
        - {protocol: TCP, port: 9093}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-egress
  namespace: vela-observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vela-lab-grafana
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vela-lab-prometheus
      ports:
        - {protocol: TCP, port: 9090}
