apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: control-ingress
  namespace: vela-lab
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: control-plane
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: worker-agent
      ports:
        - {protocol: TCP, port: 8443}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: smoke
      ports:
        - {protocol: TCP, port: 8080}
    - from:
        - namespaceSelector:
            matchLabels:
              vela.ai/network-role: observability
          podSelector:
            matchLabels:
              vela.ai/client-role: otel-collector
      ports:
        - {protocol: TCP, port: 8081}
