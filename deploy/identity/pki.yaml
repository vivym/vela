apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: vela-identity-selfsigned-bootstrap
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vela-identity-ca
  namespace: identity
spec:
  isCA: true
  commonName: vela-identity-ca
  secretName: vela-identity-ca
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: vela-identity-selfsigned-bootstrap
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: vela-identity-ca
  namespace: identity
spec:
  ca:
    secretName: vela-identity-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: keycloak
  namespace: identity
spec:
  secretName: keycloak-tls
  dnsNames:
    - keycloak.identity.svc
    - keycloak.identity.svc.cluster.local
    - keycloak.vela-system.svc
    - keycloak.vela-system.svc.cluster.local
  issuerRef:
    name: vela-identity-ca
    kind: Issuer
    group: cert-manager.io
