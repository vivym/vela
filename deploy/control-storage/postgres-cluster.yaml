apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: vela-postgres
  labels:
    app.kubernetes.io/part-of: vela
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4
  primaryUpdateStrategy: unsupervised
  minSyncReplicas: 1
  maxSyncReplicas: 2
  storage:
    size: 100Gi
    storageClass: local-path
  walStorage:
    size: 50Gi
    storageClass: local-path
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
  resources:
    requests:
      cpu: "2"
      memory: 8Gi
    limits:
      cpu: "8"
      memory: 32Gi
  postgresql:
    synchronous:
      method: any
      number: 1
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: s3://vela-postgres-backup/cluster
      endpointURL: https://s3-backup.example.invalid
      s3Credentials:
        accessKeyId:
          name: vela-backup-s3
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: vela-backup-s3
          key: SECRET_ACCESS_KEY
      wal:
        compression: gzip
        maxParallel: 2
