apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: vela-postgres-daily
  labels:
    app.kubernetes.io/part-of: vela
spec:
  schedule: "0 0 2 * * *"
  immediate: true
  backupOwnerReference: self
  method: plugin
  cluster:
    name: vela-postgres
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
