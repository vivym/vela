apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: argocd-server
  namespace: argocd
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-server
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - protocol: TCP
      port: 8082
    - protocol: TCP
      port: 8083
    - protocol: TCP
      port: 8084
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: apisix
      podSelector:
        matchLabels:
          app.kubernetes.io/name: apisix
          app.kubernetes.io/instance: apisix
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
  - to:
    - ipBlock:
        cidr: 10.43.0.1/32
    - ipBlock:
        cidr: 10.1.201.70/32
    - ipBlock:
        cidr: 10.1.201.71/32
    - ipBlock:
        cidr: 10.1.201.66/32
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 6443
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: apisix
      podSelector:
        matchLabels:
          app.kubernetes.io/name: apisix
          app.kubernetes.io/instance: apisix
    - ipBlock:
        cidr: 10.1.201.70/32
    - ipBlock:
        cidr: 10.1.201.71/32
    ports:
    - protocol: TCP
      port: 9443
    - protocol: TCP
      port: 30443
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: argocd-repo-server
    ports:
    - protocol: TCP
      port: 8081
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: argocd-redis
    ports:
    - protocol: TCP
      port: 6379
