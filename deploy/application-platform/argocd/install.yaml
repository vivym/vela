data:
  policy.default: role:none
  policy.matchMode: glob
  scopes: '[groups]'
  policy.csv: 'g, platform-admins, role:admin

    p, role:llm-api-publisher, applications, get, llm-api/*, allow

    p, role:llm-api-publisher, logs, get, llm-api/*, allow

    p, role:llm-api-publisher, projects, get, llm-api, allow

    g, llm-api-publishers, role:llm-api-publisher

    p, role:llm-api-approver, applications, get, llm-api/*, allow

    p, role:llm-api-approver, logs, get, llm-api/*, allow

    p, role:llm-api-approver, projects, get, llm-api, allow

    g, llm-api-approvers, role:llm-api-approver

    p, role:llm-api-approver, applications, sync, llm-api/*, allow

    p, role:llm-api-viewer, applications, get, llm-api/*, allow

    p, role:llm-api-viewer, logs, get, llm-api/*, allow

    p, role:llm-api-viewer, projects, get, llm-api, allow

    g, llm-api-viewers, role:llm-api-viewer

    p, role:llm-models-publisher, applications, get, llm-models/*, allow

    p, role:llm-models-publisher, logs, get, llm-models/*, allow

    p, role:llm-models-publisher, projects, get, llm-models, allow

    g, llm-models-publishers, role:llm-models-publisher

    p, role:llm-models-approver, applications, get, llm-models/*, allow

    p, role:llm-models-approver, logs, get, llm-models/*, allow

    p, role:llm-models-approver, projects, get, llm-models, allow

    g, llm-models-approvers, role:llm-models-approver

    p, role:llm-models-approver, applications, sync, llm-models/*, allow

    p, role:llm-models-viewer, applications, get, llm-models/*, allow

    p, role:llm-models-viewer, logs, get, llm-models/*, allow

    p, role:llm-models-viewer, projects, get, llm-models, allow

    g, llm-models-viewers, role:llm-models-viewer

    '
