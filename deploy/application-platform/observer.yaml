apiVersion: v1
kind: Namespace
metadata:
  name: vela-access
  labels:
    app.kubernetes.io/part-of: vela
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.35
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-observer
  namespace: vela-access
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vela-cluster-observer
rules:
  - apiGroups: [""]
    resources: [nodes, namespaces, pods, pods/log, events, services, persistentvolumes, persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vela-cluster-observer
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: vela-cluster-observer}
subjects:
  - kind: ServiceAccount
    name: cluster-observer
    namespace: vela-access
