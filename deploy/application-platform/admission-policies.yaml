# Pod Security Admission enforces restricted for all regular, init and ephemeral
# containers. These rules add identity, placement and publication constraints.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: vela-application-pods
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods, pods/ephemeralcontainers]
        scope: Namespaced
  matchConditions:
    - name: application-namespace
      expression: 'request.namespace in ["llm-api", "llm-models"]'
  variables:
    - name: containers
      expression: >-
        object.spec.containers +
        (has(object.spec.initContainers) ? object.spec.initContainers : [])
    - name: approvedSecrets
      expression: >-
        "," + (has(namespaceObject.metadata.annotations) &&
        "vela.ai/runtime-secret-names" in namespaceObject.metadata.annotations
        ? namespaceObject.metadata.annotations["vela.ai/runtime-secret-names"] : "") + ","
  validations:
    - expression: >-
        variables.containers.all(c,
          (!has(c.envFrom) || c.envFrom.all(e,
            !has(e.secretRef) || variables.approvedSecrets.contains("," + e.secretRef.name + ","))) &&
          (!has(c.env) || c.env.all(e,
            !has(e.valueFrom) || !has(e.valueFrom.secretKeyRef) ||
            variables.approvedSecrets.contains("," + e.valueFrom.secretKeyRef.name + ",")))) &&
        (!has(object.spec.ephemeralContainers) || object.spec.ephemeralContainers.all(c,
          (!has(c.envFrom) || c.envFrom.all(e,
            !has(e.secretRef) || variables.approvedSecrets.contains("," + e.secretRef.name + ","))) &&
          (!has(c.env) || c.env.all(e,
            !has(e.valueFrom) || !has(e.valueFrom.secretKeyRef) ||
            variables.approvedSecrets.contains("," + e.valueFrom.secretKeyRef.name + ","))))) &&
        (!has(object.spec.volumes) || object.spec.volumes.all(v,
          (!has(v.secret) || variables.approvedSecrets.contains("," + v.secret.secretName + ",")) &&
          (!has(v.projected) || v.projected.sources.all(s,
            !has(s.secret) || variables.approvedSecrets.contains("," + s.secret.name + ",")))))
      reason: Forbidden
      message: Runtime Secret references require the platform-owned namespace allow-list; pull credentials cannot be mounted by default.
    - expression: >-
        object.spec.serviceAccountName == request.namespace + "-runtime"
        && has(object.spec.automountServiceAccountToken)
        && object.spec.automountServiceAccountToken == false
      reason: Forbidden
      message: Use the namespace runtime ServiceAccount with automountServiceAccountToken false.
    - expression: >-
        !has(object.spec.os) || object.spec.os.name == "linux"
      reason: Forbidden
      message: Application workloads must use Linux Pod security rules.
    - expression: >-
        request.operation != "CREATE" || !has(object.spec.nodeName) || object.spec.nodeName == ""
      reason: Forbidden
      message: A Pod cannot bypass the scheduler through nodeName.
    - expression: >-
        (!has(object.spec.schedulerName) || object.spec.schedulerName == "default-scheduler")
        && (has(object.spec.priorityClassName) && object.spec.priorityClassName == "vela-application")
        && (!has(object.spec.priority) || object.spec.priority == 0)
        && has(object.spec.preemptionPolicy) && object.spec.preemptionPolicy == "Never"
      reason: Forbidden
      message: Use the default scheduler, normal priority and preemptionPolicy Never.
    - expression: >-
        has(object.spec.nodeSelector) &&
        (request.namespace == "llm-api"
          ? ("vela.ai/management" in object.spec.nodeSelector
            && object.spec.nodeSelector["vela.ai/management"] == "true"
            && "vela.ai/control-plane-tier" in object.spec.nodeSelector
            && object.spec.nodeSelector["vela.ai/control-plane-tier"] == "cpu")
          : ("vela.ai/node-role" in object.spec.nodeSelector
            && object.spec.nodeSelector["vela.ai/node-role"] == "gpu-worker"))
      reason: Forbidden
      message: Non-model API Pods select CPU management nodes; model and codec Pods select GPU workers.
    - expression: >-
        !has(object.spec.tolerations) || object.spec.tolerations.all(t,
          has(t.key) && t.key in ["node.kubernetes.io/not-ready", "node.kubernetes.io/unreachable"]
          && has(t.effect) && t.effect == "NoExecute"
          && has(t.tolerationSeconds) && t.tolerationSeconds <= 300)
      reason: Forbidden
      message: Only bounded Kubernetes not-ready/unreachable tolerations are permitted.
    - expression: >-
        !has(object.spec.runtimeClassName) ||
        (request.namespace == "llm-models" && object.spec.runtimeClassName == "nvidia")
      reason: Forbidden
      message: Custom RuntimeClasses are forbidden; model Pods may use nvidia.
    - expression: >-
        !has(object.spec.volumes) || object.spec.volumes.all(v,
          has(v.emptyDir) || has(v.configMap) || has(v.secret) || has(v.downwardAPI) ||
          (request.namespace == "llm-models" && has(v.persistentVolumeClaim) &&
            v.persistentVolumeClaim.claimName == "qwen3-models") ||
          (has(v.projected) && v.projected.sources.all(s,
            has(s.configMap) || has(s.secret) || has(s.downwardAPI))))
      reason: Forbidden
      message: Volumes cannot expose host paths, API tokens, CSI or unapproved persistent storage.
    - expression: >-
        object.spec.containers.all(c, c.image.matches("^.+@sha256:[0-9a-f]{64}$")) &&
        (!has(object.spec.initContainers) || object.spec.initContainers.all(c,
          c.image.matches("^.+@sha256:[0-9a-f]{64}$"))) &&
        (!has(object.spec.ephemeralContainers) || object.spec.ephemeralContainers.all(c,
          c.image.matches("^.+@sha256:[0-9a-f]{64}$")))
      reason: Forbidden
      message: Every container image must be pinned to a SHA256 digest.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: vela-application-pods
spec:
  policyName: vela-application-pods
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: vela-application-services
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [services]
        scope: Namespaced
  matchConditions:
    - name: application-namespace
      expression: 'request.namespace in ["llm-api", "llm-models"]'
  validations:
    - expression: >-
        object.spec.type == "ClusterIP"
        && (!has(object.spec.externalIPs) || size(object.spec.externalIPs) == 0)
        && (!has(object.spec.externalName) || object.spec.externalName == "")
        && (!has(object.spec.loadBalancerIP) || object.spec.loadBalancerIP == "")
        && has(object.spec.selector) && size(object.spec.selector) > 0
      reason: Forbidden
      message: Only selector-backed ClusterIP Services are allowed; external publication uses APISIX.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: vela-application-services
spec:
  policyName: vela-application-services
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: vela-application-secrets
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [secrets]
        scope: Namespaced
  matchConditions:
    - name: application-namespace
      expression: 'request.namespace in ["llm-api", "llm-models"]'
  validations:
    - expression: >-
        object.type in ["Opaque", "kubernetes.io/tls", "kubernetes.io/dockerconfigjson", "helm.sh/release.v1"]
      reason: Forbidden
      message: ServiceAccount token Secrets are forbidden; use short-lived TokenRequest credentials.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: vela-application-secrets
spec:
  policyName: vela-application-secrets
  validationActions: [Deny]
