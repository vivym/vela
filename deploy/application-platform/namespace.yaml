apiVersion: v1
kind: Namespace
metadata:
  name: llm-api
  labels:
    app.kubernetes.io/part-of: vela
    vela.ai/tenant: llm-api
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.35
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.35
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.35
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm-api-runtime
  namespace: llm-api
automountServiceAccountToken: false
imagePullSecrets:
  - name: vela-release-pull-v1
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm-api-ci
  namespace: llm-api
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm-api-viewer
  namespace: llm-api
automountServiceAccountToken: false
---
# Initial shared tenant ceiling, not a reservation or a workload sizing claim.
# Durable storage stays closed until R5 capacity has been resolved.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: application-budget
  namespace: llm-api
spec:
  hard:
    requests.cpu: "8"
    limits.cpu: "8"
    requests.memory: 8Gi
    limits.memory: 8Gi
    requests.ephemeral-storage: 8Gi
    limits.ephemeral-storage: 8Gi
    requests.nvidia.com/gpu: "0"
    persistentvolumeclaims: "0"
    requests.storage: "0"
    services: "20"
    services.nodeports: "0"
    services.loadbalancers: "0"
    secrets: "60"
    configmaps: "60"
    pods: "24"
    count/jobs.batch: "20"
    count/cronjobs.batch: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: application-defaults
  namespace: llm-api
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 100m, memory: 128Mi, ephemeral-storage: 128Mi}
      default: {cpu: "1", memory: 1Gi, ephemeral-storage: 1Gi}
---
apiVersion: v1
kind: Namespace
metadata:
  name: llm-models
  labels:
    app.kubernetes.io/part-of: vela
    vela.ai/tenant: llm-models
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.35
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.35
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.35
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm-models-runtime
  namespace: llm-models
automountServiceAccountToken: false
imagePullSecrets:
  - name: vela-release-pull-v1
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm-models-ci
  namespace: llm-models
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm-models-viewer
  namespace: llm-models
automountServiceAccountToken: false
---
# Initial shared tenant ceiling, not a reservation or a workload sizing claim.
# Durable storage stays closed until R5 capacity has been resolved.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: application-budget
  namespace: llm-models
spec:
  hard:
    requests.cpu: "32"
    limits.cpu: "32"
    requests.memory: 64Gi
    limits.memory: 64Gi
    requests.ephemeral-storage: 64Gi
    limits.ephemeral-storage: 64Gi
    requests.nvidia.com/gpu: "8"
    persistentvolumeclaims: "0"
    requests.storage: "0"
    services: "20"
    services.nodeports: "0"
    services.loadbalancers: "0"
    secrets: "60"
    configmaps: "60"
    pods: "48"
    count/jobs.batch: "20"
    count/cronjobs.batch: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: application-defaults
  namespace: llm-models
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 100m, memory: 128Mi, ephemeral-storage: 128Mi}
      default: {cpu: "1", memory: 1Gi, ephemeral-storage: 1Gi}
