  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: application-viewer
  namespace: llm-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: application-viewer
subjects:
- kind: ServiceAccount
  name: llm-api-viewer
  namespace: llm-api
