apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vela-control-default-deny-ingress
  namespace: vela-system
  labels:
    app.kubernetes.io/name: vela-control
    app.kubernetes.io/part-of: vela
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vela-control
  policyTypes:
    - Ingress
  ingress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vela-control-allow-api
  namespace: vela-system
  labels:
    app.kubernetes.io/name: vela-control
    app.kubernetes.io/component: public-api
    app.kubernetes.io/part-of: vela
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vela-control
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              vela.ai/network-role: api-ingress
          podSelector:
            matchLabels:
              vela.ai/client-role: api-gateway
      ports:
        - protocol: TCP
          port: 8080
---
