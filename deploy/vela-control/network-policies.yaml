    app.kubernetes.io/name: vela-control
    app.kubernetes.io/component: fleet-maintenance
    app.kubernetes.io/part-of: vela
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vela-control
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 192.0.2.0/32
      ports:
        - protocol: TCP
          port: 8444
