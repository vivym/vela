apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vela-control-default-deny-ingress
  namespace: vela-system
  labels:
    app.kubernetes.io/name: vela-control
    app.kubernetes.io/part-of: vela
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vela-control
  policyTypes:
    - Ingress
  ingress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vela-control-allow-api
  namespace: vela-system
  labels:
    app.kubernetes.io/name: vela-control
    app.kubernetes.io/component: public-api
    app.kubernetes.io/part-of: vela
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vela-control
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              vela.ai/network-role: api-ingress
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vela-control-allow-worker
  namespace: vela-system
  labels:
    app.kubernetes.io/name: vela-control
    app.kubernetes.io/component: worker-control
    app.kubernetes.io/part-of: vela
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vela-control
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vela-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: vela-h3-worker
      ports:
        - protocol: TCP
          port: 8443
---
