apiVersion: batch/v1
kind: Job
metadata:
  name: apisix-observability-policy
  namespace: apisix
  labels:
    app.kubernetes.io/part-of: vela
    app.kubernetes.io/component: gateway-observability
  annotations:
    vela.ai/operation: configure-prometheus-and-opentelemetry
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 6
  template:
    metadata:
      labels: {app.kubernetes.io/name: apisix-observability-policy}
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: configure
          image: 10.1.201.70:5000/curlimages/curl:8.16.0
          imagePullPolicy: IfNotPresent
          env:
            - name: APISIX_ADMIN
              valueFrom:
                secretKeyRef: {name: apisix-admin-credentials, key: admin}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              curl --fail --silent --show-error --retry 12 --retry-delay 3 \
                -H "X-API-KEY: $APISIX_ADMIN" -H "Content-Type: application/json" \
                -X PUT http://apisix-admin.apisix.svc.cluster.local:9180/apisix/admin/plugin_metadata/opentelemetry \
                --data '{"trace_id_source":"x-request-id","resource":{"service.name":"APISIX","deployment.environment":"marslab"},"collector":{"address":"otel-collector.monitoring.svc.cluster.local:4318","request_timeout":3},"sampler":{"name":"parent_base","options":{"root":{"name":"trace_id_ratio","options":{"fraction":0.1}}}},"batch_span_processor":{"drop_on_queue_full":true,"max_queue_size":1024,"batch_timeout":2,"inactive_timeout":1,"max_export_batch_size":128},"set_ngx_var":false}'
              response=$(curl --silent --show-error --retry 12 --retry-delay 3 \
                -H "X-API-KEY: $APISIX_ADMIN" -H "Content-Type: application/json" \
                -X PUT http://apisix-admin.apisix.svc.cluster.local:9180/apisix/admin/global_rules/1 \
                --data '{"plugins":{"prometheus":{},"opentelemetry":{"sampler":{"name":"parent_base","options":{"root":{"name":"trace_id_ratio","options":{"fraction":0.1}}}}},"redirect":{"uri":"https://$host:30443$request_uri","ret_code":308,"_meta":{"filter":[["scheme","==","http"]]}}}}' \
                --write-out '\nHTTP_STATUS:%{http_code}')
              echo "$response"
              test "${response##*HTTP_STATUS:}" = "200"
              echo observability-policy-applied-with-otel
