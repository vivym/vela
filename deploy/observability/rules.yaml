groups:
  - name: vela-api-slo
    interval: 30s
    rules:
      - record: vela:api_availability:ratio_30d
        expr: sum(increase(vela_gateway_sli_requests_total{classification="good"}[30d])) / sum(increase(vela_gateway_sli_requests_total{classification="eligible"}[30d]))
      - record: vela:api_error_budget_remaining:ratio_30d
        expr: 1 - ((1 - vela:api_availability:ratio_30d) / (1 - 0.999))
      - alert: VelaAPIErrorBudgetFastBurn
        expr: ((1 - (sum(rate(vela_gateway_sli_requests_total{classification="good"}[5m])) / sum(rate(vela_gateway_sli_requests_total{classification="eligible"}[5m])))) > (14.4 * (1 - 0.999))) and ((1 - (sum(rate(vela_gateway_sli_requests_total{classification="good"}[1h])) / sum(rate(vela_gateway_sli_requests_total{classification="eligible"}[1h])))) > (14.4 * (1 - 0.999)))
        for: 2m
        labels:
          severity: page
        annotations:
          runbook: docs/runbooks/statistical-slo-breach.md
      - alert: VelaAPIErrorBudgetSlowBurn
        expr: ((1 - (sum(rate(vela_gateway_sli_requests_total{classification="good"}[6h])) / sum(rate(vela_gateway_sli_requests_total{classification="eligible"}[6h])))) > (3 * (1 - 0.999))) and ((1 - (sum(rate(vela_gateway_sli_requests_total{classification="good"}[3d])) / sum(rate(vela_gateway_sli_requests_total{classification="eligible"}[3d])))) > (3 * (1 - 0.999)))
        for: 1h
        labels:
          severity: page
        annotations:
          runbook: docs/runbooks/statistical-slo-breach.md
      - alert: VelaAPISLISeriesMissing
        expr: absent(sum(vela_gateway_sli_requests_total{classification="eligible"})) or absent(sum(vela_gateway_sli_requests_total{classification="good"}))
        for: 10m
        labels:
          severity: page
        annotations:
          runbook: docs/runbooks/statistical-slo-breach.md
  - name: vela-preset-slo
    interval: 30s
    rules:
      - record: vela:slo_report_p95_ratio
        expr: vela_slo_report_p95_milliseconds / vela_slo_target_p95_milliseconds
      - record: vela:slo_report_success_margin
        expr: vela_slo_report_success_lower_bound_ratio - vela_slo_target_success_ratio
      - alert: VelaPresetP95SLOBreach
        expr: vela:slo_report_p95_ratio > 1
        for: 15m
        labels:
          severity: page
        annotations:
          runbook: docs/runbooks/statistical-slo-breach.md
      - alert: VelaPresetSuccessSLOBreach
        expr: vela:slo_report_success_margin < 0
        for: 15m
        labels:
          severity: page
        annotations:
          runbook: docs/runbooks/statistical-slo-breach.md
      - alert: VelaSLOContractCoverageMissing
        expr: vela_slo_contract_report_coverage == 0 or absent(vela_slo_contract_report_coverage)
        for: 30m
        labels:
          severity: page
        annotations:
          runbook: docs/runbooks/statistical-slo-breach.md
      - alert: VelaSLOTelemetryStale
        expr: time() - max(vela_slo_report_sealed_timestamp_seconds) > 3456000
        for: 30m
        labels:
          severity: page
        annotations:
          runbook: docs/runbooks/statistical-slo-breach.md
      - alert: VelaSLOExporterFailed
        expr: max(vela_slo_report_exporter_last_scrape_success) == 0 or absent(vela_slo_report_exporter_last_scrape_success)
        for: 10m
        labels:
          severity: page
        annotations:
          runbook: docs/runbooks/statistical-slo-breach.md
  - name: vela-stage-campaign
    interval: 30s
    rules:
      - record: vela:stage_ready_oldest_age_seconds:max
        expr: max by (stage_kind) (vela_stage_ready_oldest_age_seconds{stage_kind=~"ENCODER|DIT|VAE_DECODER"})
      - record: vela:stage_transfer_active_oldest_age_seconds:max
        expr: max(vela_stage_transfer_active_oldest_age_seconds)
      - record: vela:stage_scheduler_divergence:increase_5m
        expr: sum(increase(vela_stage_scheduler_shadow_replay_total{outcome="DIVERGED"}[5m]))
      - alert: VelaStageAuthorityExporterFailed
        expr: max(vela_stage_authority_exporter_last_scrape_success) == 0 or absent(vela_stage_authority_exporter_last_scrape_success)
        for: 5m
        labels:
          severity: page
        annotations:
          runbook: docs/runbooks/h3-stage-campaign.md
      - alert: VelaStageReadyQueueStalled
        expr: vela:stage_ready_oldest_age_seconds:max > 900
        for: 10m
        labels:
          severity: page
        annotations:
          runbook: docs/runbooks/h3-stage-campaign.md
      - alert: VelaStageSchedulerReplayDiverged
        expr: vela:stage_scheduler_divergence:increase_5m > 0
        labels:
          severity: page
        annotations:
          runbook: docs/runbooks/h3-stage-campaign.md
      - alert: VelaStageTransferTicketStuck
        expr: vela:stage_transfer_active_oldest_age_seconds:max > 300
        for: 5m
        labels:
          severity: page
        annotations:
          runbook: docs/runbooks/h3-stage-campaign.md
      - alert: VelaStageModelResidencyCoverageMissing
        expr: absent(vela_stage_model_residency_state_count{stage_kind="ENCODER",state="READY"}) or absent(vela_stage_model_residency_state_count{stage_kind="DIT",state="READY"}) or absent(vela_stage_model_residency_state_count{stage_kind="VAE_DECODER",state="READY"})
        for: 5m
        labels:
          severity: page
        annotations:
          runbook: docs/runbooks/h3-stage-campaign.md
