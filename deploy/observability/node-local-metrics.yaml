---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: node-local-metrics
  namespace: monitoring
  labels:
    app.kubernetes.io/name: node-local-metrics
    app.kubernetes.io/part-of: vela
    release: monitoring
spec:
  scrapeClass: rke2-node-metrics
  selector:
    matchLabels:
      app.kubernetes.io/name: node-local-metrics
  podMetricsEndpoints:
  - port: https-metrics
    scheme: https
    path: "/metrics"
    interval: 30s
    scrapeTimeout: 15s
    honorLabels: true
    tlsConfig:
      ca:
        secret:
          name: node-metrics-server-tls
          key: ca.crt
      serverName: vela-node-metrics
    relabelings:
    - targetLabel: job
      replacement: node-local-metrics
    - sourceLabels:
      - __meta_kubernetes_pod_node_name
      targetLabel: node
