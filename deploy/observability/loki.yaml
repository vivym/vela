apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: monitoring
  labels: {app.kubernetes.io/part-of: vela}
data:
  config.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
    common:
      path_prefix: /var/loki
      replication_factor: 1
      ring:
        kvstore: {store: inmemory}
      storage:
        filesystem:
          chunks_directory: /var/loki/chunks
          rules_directory: /var/loki/rules
    schema_config:
      configs:
        - from: 2025-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    # Kubernetes log tails may reconnect after kubelet log rotation and deliver
    # delayed lines. Keep a bounded 24-hour out-of-order window so those lines
    # are accepted instead of causing repeated 400 responses; retention and
    # per-stream limits remain enforced below.
    ingester:
      max_chunk_age: 24h
    limits_config:
      retention_period: 168h
      ingestion_rate_mb: 16
      ingestion_burst_size_mb: 32
      max_line_size: 256kb
      max_line_size_truncate: true
      max_query_length: 168h
      max_query_parallelism: 8
      reject_old_samples: true
      reject_old_samples_max_age: 168h
    compactor:
      working_directory: /var/loki/compactor
      retention_enabled: true
      delete_request_store: filesystem
    analytics: {reporting_enabled: false}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: monitoring
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/part-of: vela
spec:
  selector: {app.kubernetes.io/name: loki}
  ports:
    - {name: http, port: 3100, targetPort: http}
    - {name: grpc, port: 9096, targetPort: grpc}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: monitoring
  labels: {app.kubernetes.io/name: loki, app.kubernetes.io/part-of: vela}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: loki}}
  template:
    metadata: {labels: {app.kubernetes.io/name: loki, app.kubernetes.io/part-of: vela}}
    spec:
      securityContext:
        fsGroup: 10001
        runAsUser: 10001
        runAsGroup: 10001
      nodeSelector: {vela.ai/management: "true"}
      tolerations:
        - {key: node-role.kubernetes.io/control-plane, operator: Exists}
      containers:
        - name: loki
          image: 10.1.201.70:5000/grafana/loki:3.5.3
          args: ["-config.file=/etc/loki/config.yaml"]
          ports:
            - {name: http, containerPort: 3100}
            - {name: grpc, containerPort: 9096}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          readinessProbe: {httpGet: {path: /ready, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /ready, port: http}, periodSeconds: 20}
          volumeMounts:
            - {name: config, mountPath: /etc/loki}
            - {name: data, mountPath: /var/loki}
      volumes:
        - {name: config, configMap: {name: loki-config}}
        - {name: data, persistentVolumeClaim: {claimName: loki-data}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data
  namespace: monitoring
  labels: {app.kubernetes.io/name: loki, app.kubernetes.io/part-of: vela}
spec:
  storageClassName: longhorn
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 100Gi}}
