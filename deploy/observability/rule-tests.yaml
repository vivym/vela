rule_files:
  - rules.yaml
evaluation_interval: 1m
tests:
  - name: Preset p95 breach pages
    interval: 1m
    input_series:
      - series: 'vela_slo_report_p95_milliseconds{model_revision="m1",generation_preset="fast",generation_preset_revision="p1",service_class_revision="s1",output_spec="o1",generation_count="1",result="FAIL"}'
        values: '61000x20'
      - series: 'vela_slo_target_p95_milliseconds{model_revision="m1",generation_preset="fast",generation_preset_revision="p1",service_class_revision="s1",output_spec="o1",generation_count="1",result="FAIL"}'
        values: '60000x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: VelaPresetP95SLOBreach
        exp_alerts:
          - exp_labels:
              severity: page
              model_revision: m1
              generation_preset: fast
              generation_preset_revision: p1
              service_class_revision: s1
              output_spec: o1
              generation_count: "1"
              result: FAIL
            exp_annotations:
              runbook: docs/runbooks/statistical-slo-breach.md
  - name: Missing API SLI series pages
    interval: 1m
    alert_rule_test:
      - eval_time: 11m
        alertname: VelaAPISLISeriesMissing
        exp_alerts:
          - exp_labels:
              severity: page
            exp_annotations:
              runbook: docs/runbooks/statistical-slo-breach.md
  - name: Missing exact contract report pages
    interval: 1m
    input_series:
      - series: 'vela_slo_contract_report_coverage{model_revision="m1",generation_preset="fast",generation_preset_revision="p1",service_class_revision="s1",output_spec="o1",generation_count="2"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 31m
        alertname: VelaSLOContractCoverageMissing
        exp_alerts:
          - exp_labels:
              severity: page
              model_revision: m1
              generation_preset: fast
              generation_preset_revision: p1
              service_class_revision: s1
              output_spec: o1
              generation_count: "2"
            exp_annotations:
              runbook: docs/runbooks/statistical-slo-breach.md
  - name: Missing Stage authority exporter pages
    interval: 1m
    alert_rule_test:
      - eval_time: 6m
        alertname: VelaStageAuthorityExporterFailed
        exp_alerts:
          - exp_labels:
              severity: page
            exp_annotations:
              runbook: docs/runbooks/h3-stage-campaign.md
  - name: Old READY StageRun pages
    interval: 1m
    input_series:
      - series: 'vela_stage_ready_oldest_age_seconds{stage_kind="DIT"}'
        values: '901x25'
    alert_rule_test:
      - eval_time: 21m
        alertname: VelaStageReadyQueueStalled
        exp_alerts:
          - exp_labels:
              severity: page
              stage_kind: DIT
            exp_annotations:
              runbook: docs/runbooks/h3-stage-campaign.md
  - name: StageScheduler replay divergence pages
    interval: 1m
    input_series:
      - series: 'vela_stage_scheduler_shadow_replay_total{outcome="DIVERGED",reason="REPLAY_DIVERGED",algorithm_revision="stage-scheduler-v1"}'
        values: '0+1x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: VelaStageSchedulerReplayDiverged
        exp_alerts:
          - exp_labels:
              severity: page
            exp_annotations:
              runbook: docs/runbooks/h3-stage-campaign.md
  - name: Old ACTIVE TransferTicket pages
    interval: 1m
    input_series:
      - series: 'vela_stage_transfer_active_oldest_age_seconds'
        values: '301x12'
    alert_rule_test:
      - eval_time: 11m
        alertname: VelaStageTransferTicketStuck
        exp_alerts:
          - exp_labels:
              severity: page
            exp_annotations:
              runbook: docs/runbooks/h3-stage-campaign.md
  - name: Missing H3 residency pages
    interval: 1m
    input_series:
      - series: 'vela_stage_model_residency_state_count{stage_kind="DIT",state="READY"}'
        values: '7x10'
      - series: 'vela_stage_model_residency_state_count{stage_kind="VAE_DECODER",state="READY"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: VelaStageModelResidencyCoverageMissing
        exp_alerts:
          - exp_labels:
              severity: page
              stage_kind: ENCODER
              state: READY
            exp_annotations:
              runbook: docs/runbooks/h3-stage-campaign.md
