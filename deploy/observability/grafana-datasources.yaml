apiVersion: v1
kind: ConfigMap
metadata:
  name: vela-grafana-datasources
  namespace: monitoring
  labels:
    grafana_datasource: "1"
    app.kubernetes.io/part-of: vela
    app.kubernetes.io/component: observability
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Vela Prometheus
        uid: vela-prometheus
        type: prometheus
        access: proxy
        url: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
        # kube-prometheus-stack owns the single default Prometheus datasource.
        # Dashboards use this stable UID explicitly.
        isDefault: false
        jsonData:
          httpMethod: POST
          manageAlerts: true
          alertmanagerUid: vela-alertmanager
        editable: false
      - name: Vela Alertmanager
        uid: vela-alertmanager
        type: alertmanager
        access: proxy
        url: http://monitoring-kube-prometheus-alertmanager.monitoring.svc.cluster.local:9093
        jsonData:
          implementation: prometheus
          handleGrafanaManagedAlerts: false
        editable: false
      - name: Vela Loki
        uid: vela-loki
        type: loki
        access: proxy
        url: http://loki.monitoring.svc.cluster.local:3100
        jsonData:
          maxLines: 1000
        editable: false
      - name: Vela Tempo
        uid: vela-tempo
        type: tempo
        access: proxy
        url: http://tempo.monitoring.svc.cluster.local:3200
        jsonData:
          tracesToLogs:
            datasourceUid: vela-loki
            filterByTraceID: true
          serviceMap:
            datasourceUid: vela-prometheus
        editable: false
