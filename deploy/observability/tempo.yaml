apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  namespace: monitoring
  labels: {app.kubernetes.io/part-of: vela}
data:
  tempo.yaml: |
    server:
      http_listen_port: 3200
    distributor:
      receivers:
        otlp:
          protocols:
            grpc: {endpoint: 0.0.0.0:4317}
            http: {endpoint: 0.0.0.0:4318}
    ingester:
      max_block_duration: 5m
    compactor:
      compaction:
        block_retention: 48h
    storage:
      trace:
        backend: local
        wal: {path: /var/tempo/wal}
        local: {path: /var/tempo/blocks}
    metrics_generator:
      registry:
        external_labels: {source: tempo, cluster: marslab}
      storage: {path: /var/tempo/generator/wal}
    overrides:
      defaults:
        metrics_generator:
          processors: [service-graphs, span-metrics]
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: monitoring
  labels: {app.kubernetes.io/name: tempo, app.kubernetes.io/part-of: vela}
spec:
  selector: {app.kubernetes.io/name: tempo}
  ports:
    - {name: http, port: 3200, targetPort: http}
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  namespace: monitoring
  labels: {app.kubernetes.io/name: tempo, app.kubernetes.io/part-of: vela}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: tempo}}
  template:
    metadata: {labels: {app.kubernetes.io/name: tempo, app.kubernetes.io/part-of: vela}}
    spec:
      securityContext:
        fsGroup: 10001
        runAsUser: 10001
        runAsGroup: 10001
      nodeSelector: {vela.ai/management: "true"}
      tolerations: [{key: node-role.kubernetes.io/control-plane, operator: Exists}]
      containers:
        - name: tempo
          image: 10.1.201.70:5000/grafana/tempo:2.8.2
          args: ["-config.file=/etc/tempo/tempo.yaml"]
          ports:
            - {name: http, containerPort: 3200}
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe: {httpGet: {path: /ready, port: http}, periodSeconds: 10}
          volumeMounts:
            - {name: config, mountPath: /etc/tempo}
            - {name: data, mountPath: /var/tempo}
      volumes:
        - {name: config, configMap: {name: tempo-config}}
        - {name: data, persistentVolumeClaim: {claimName: tempo-data}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tempo-data
  namespace: monitoring
  labels: {app.kubernetes.io/name: tempo, app.kubernetes.io/part-of: vela}
spec:
  storageClassName: longhorn
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 30Gi}}
