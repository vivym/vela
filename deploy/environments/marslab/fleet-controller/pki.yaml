apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vela-fleet-client-ca
  namespace: vela-system
  labels: {app.kubernetes.io/part-of: vela, app.kubernetes.io/component: fleet-pki}
spec:
  secretName: vela-fleet-client-ca
  isCA: true
  commonName: vela-fleet-client-ca
  duration: 87600h
  renewBefore: 8760h
  privateKey: {algorithm: ECDSA, size: 256, rotationPolicy: Always}
  usages: [cert sign, crl sign]
  issuerRef: {name: vela-identity-selfsigned-bootstrap, kind: ClusterIssuer}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: vela-fleet-client-ca
  namespace: vela-system
  labels: {app.kubernetes.io/part-of: vela, app.kubernetes.io/component: fleet-pki}
spec:
  ca: {secretName: vela-fleet-client-ca}
---
