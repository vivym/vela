{
  "apiVersion": "kustomize.config.k8s.io/v1beta1",
  "kind": "Kustomization",
  "resources": [
    "../../../fleet-controller",
    "network-policy.yaml"
  ],
  "patches": [
    {
      "target": {
        "kind": "ConfigMap",
        "name": "vela-fleet-residency-plan-rollouts-placeholder"
      },
      "path": "rollouts.patch.json",
      "options": {
        "allowNameChange": true
      }
    },
    {
      "path": "deployment.patch.json"
    },
    {
      "target": {
        "kind": "ValidatingWebhookConfiguration",
        "name": "vela-fleet-protection"
      },
      "path": "webhook.patch.json"
    }
  ]
}
