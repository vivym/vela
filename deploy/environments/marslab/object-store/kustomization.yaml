apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../object-store
  - ../../../object-store/ha-six
patches:
  - target:
      kind: StatefulSet
      name: minio-ha
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 8Gi
  - target:
      kind: Service
      name: minio
    patch: |-
      - op: replace
        path: /spec/selector
        value:
          app: minio-ha
  - target:
      kind: StatefulSet
      name: minio
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
